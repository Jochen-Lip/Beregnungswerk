    function formatTab2ZeitInput(raw) {
        var digits = String(raw == null ? '' : raw).replace(/\D/g, '').slice(0, 4);
        if (!digits.length) {
            return '';
        }
        var d = digits.split('');
        var h1 = d[0];
        var h1n = parseInt(h1, 10);

        // Stunden 3–9: nur eine Ziffer, danach Minuten
        if (h1n > 2) {
            if (d.length === 1) {
                return h1;
            }
            var m1a = d[1];
            if (parseInt(m1a, 10) > 5) {
                return h1;
            }
            if (d.length === 2) {
                return h1 + ':' + m1a;
            }
            return h1 + ':' + m1a + d[2];
        }

        // Stunden beginnen mit 0, 1 oder 2
        if (d.length === 1) {
            return h1;
        }
        var h2 = d[1];
        if (parseInt(h1 + h2, 10) > 23) {
            return h1;
        }
        if (d.length === 2) {
            return h1 + h2;
        }
        var m1b = d[2];
        if (parseInt(m1b, 10) > 5) {
            return h1 + h2;
        }
        if (d.length === 3) {
            return h1 + h2 + ':' + m1b;
        }
        return h1 + h2 + ':' + m1b + d[3];
    }

        return formatted.replace(/\D/g, '').length === mergedDigits.length;
    }

    function resolveTab2ZeitCommitValue(raw, index) {
        var s = String(raw != null ? raw : '').trim();
        if (raw === true || raw === false || s === 'true' || s === 'false') {

        }
        if (isTab2ZeitEmptyValue(s || raw)) {
            return tab2ZeitDpValueForEmpty();
        }
        if (isVentilLikeZeitValue(s)) {
            s = defaultSchaltzeitZeitForRowIndex(index) || '';
            if (isTab2ZeitEmptyValue(s)) {
                return tab2ZeitDpValueForEmpty();
            }
        }
        if (isCompleteTab2ZeitValue(s)) {
            return normalizeTab2ZeitValue(s, index, false);
        }
        return null;

    function tab2ZeitCaretPos(formatted, digitCount) {
        var n = Math.max(0, digitCount);
        if (n <= 2) {
            if (n === 2 && formatted.length >= 3 && formatted.charAt(2) === ':') {
                return 3;
            }
            return n;
        }
        return Math.min(3 + (n - 2), formatted.length);
    }

    function applyTab2ZeitAutoFormat(input) {
        if (!input || input._bwZeitFormatting) {
            return;
        }
        var el = input.tagName === 'INPUT' ? input : (input.querySelector('input') || input);
        var raw = String(el.value || '');
        var formatted = formatTab2ZeitInput(raw);
        if (formatted === raw) {
            return;
        }
        var selStart = el.selectionStart == null ? raw.length : el.selectionStart;
        var digitsBefore = raw.slice(0, selStart).replace(/\D/g, '').length;
        input._bwZeitFormatting = true;
        try {
            var desc = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value');
            if (desc && desc.set) {
                desc.set.call(el, formatted);
            } else {
                el.value = formatted;
            }
            var caret = tab2ZeitCaretPos(formatted, digitsBefore);
            try {
                el.setSelectionRange(caret, caret);
            } catch (eCaret) {}
            el.dispatchEvent(new Event('input', { bubbles: true }));
        } finally {
            input._bwZeitFormatting = false;
        }

    function stripLegacySchaltzeitZeitForIndex(index, zeit) {

    function normalizeTab2ZeitValue(zeit, index, fillDefault) {
        var useDefault = fillDefault !== false;
        if (typeof zeit === 'boolean') {

        var s = String(zeit != null ? zeit : '').trim();
        if (isTab2ZeitEmptyValue(s)) {
            s = '';

        if (isVentilLikeZeitValue(s)) {
            return stripLegacySchaltzeitZeitForIndex(index, defaultSchaltzeitZeitForRowIndex(index));
        }
        var hm = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
        if (hm) {
            var h = Math.max(0, Math.min(23, parseInt(hm[1], 10) || 0));
            var mi = Math.max(0, Math.min(59, parseInt(hm[2], 10) || 0));
            s = (h < 10 ? '0' : '') + h + ':' + (mi < 10 ? '0' : '') + mi;
            return stripLegacySchaltzeitZeitForIndex(index, s);
        }
        if (!s) {
            if (useDefault) {
                var def = defaultSchaltzeitZeitForRowIndex(index);
                if (def) {
                    return stripLegacySchaltzeitZeitForIndex(index, def);

            return '';

        return stripLegacySchaltzeitZeitForIndex(index, s);

    var BW_WOCHENTAG_LABELS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

    function wochentagTagStatesFromTimeEventRow(row) {
        var states = defaultWochentagTagStates();
        if (!row || typeof row !== 'object') {
            return states;

        if (row.wochentag) {
            try {
                var parsed = JSON.parse(String(row.wochentag));
                if (parsed && typeof parsed === 'object') {
                    allWochentagTagKeys().forEach(function (key) {
                        if (parsed[key] !== undefined) {
                            states[key] = !!parsed[key];
                        }

                    return states;
                }
            } catch (eParse) {}
        }
        allWochentagTagKeys().forEach(function (key) {
            if (row[key] !== undefined) {
                states[key] = !!row[key];
            }
        });
        return states;
    }

            panel.removeAttribute('data-bw-astro-refreshing');

        getStateViaAdmin(socket, schaltzeitAstroTypStateId(slot), function (err, st) {
            if (err) {

                typVal = normalizeAstroTypValue(st && st.val, slot);

            doneOne();

        getStateViaAdmin(socket, schaltzeitAstroOffsetStateId(slot), function (err, st) {
            if (err) {
                hadError = true;
            } else if (st && Object.prototype.hasOwnProperty.call(st, 'val')) {
                offVal = normalizeAstroOffsetValue(st.val);
            }
            doneOne();
        });
    }

    var bwTab2AstroCoords = null;
    var bwTab2AstroCoordsPending = false;
    var BW_ASTRO_ZEIT_GREEN = '#81c784';

    function tab2SunTimes(date, lat, lon) {
        var PI = Math.PI;
        var rad = PI / 180;
        var dayMs = 86400000;
        var J1970 = 2440588;
        var J2000 = 2451545;
        var J0 = 0.0009;
        var e = rad * 23.4397;
        var angles = [
            [-0.833, 'sunrise', 'sunset'],
            [-0.833, 'sunriseEnd', 'sunsetStart'],
            [-6, 'dawn', 'dusk'],
            [-18, 'nightEnd', 'night'],
            [6, 'goldenHourEnd', 'goldenHour']
        ];
        function toDays(d) {
            return d.valueOf() / dayMs - 0.5 + J1970 - J2000;
        }
        function declination(l) {
            return Math.asin(Math.sin(0) * Math.cos(e) + Math.cos(0) * Math.sin(e) * Math.sin(l));
        }
        function solarMeanAnomaly(d) {
            return rad * (357.5291 + 0.98560028 * d);
        }
        function eclipticLongitude(M) {
            var C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
            return M + C + rad * 102.9372 + PI;
        }
        function solarTransitJ(ds, M, L) {
            return J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
        }
        function hourAngle(h, phi, dec) {
            var x = (Math.sin(h) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec));
            if (x < -1 || x > 1) {
                return NaN;
            }
            return Math.acos(x);
        }
        function fromJulian(j) {
            return new Date((j + 0.5 - J1970) * dayMs);
        }
        var lw = rad * -lon;
        var phi = rad * lat;
        var d = toDays(date);
        var n = Math.round(d - J0 - lw / (2 * PI));
        var ds = J0 + lw / (2 * PI) + n;
        var M = solarMeanAnomaly(ds);
        var L = eclipticLongitude(M);
        var dec = declination(L);
        var Jnoon = solarTransitJ(ds, M, L);
        var result = { solarNoon: fromJulian(Jnoon) };
        angles.forEach(function (rowAng) {
            var w = hourAngle(rowAng[0] * rad, phi, dec);
            if (isNaN(w)) {
                return;
            }
            var a = J0 + (w + lw) / (2 * PI) + n;
            var Jset = solarTransitJ(a, M, L);
            var Jrise = Jnoon - (Jset - Jnoon);
            result[rowAng[1]] = fromJulian(Jrise);
            result[rowAng[2]] = fromJulian(Jset);
        });
        return result;
    }

    function tab2NextAstroDate(typ, offsetMin, lat, lon) {
        var now = new Date();
        var i;
        for (i = 0; i < 4; i += 1) {
            var day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, 12, 0, 0, 0);
            var times = tab2SunTimes(day, lat, lon);
            var basis = times[typ];
            if (!basis || isNaN(basis.getTime())) {
                continue;
            }
            var start = new Date(basis.getTime() + offsetMin * 60000);
            if (start.getTime() > now.getTime()) {
                return start;
            }
        }
        return null;
    }

    function tab2FormatHm(when) {
        if (!when || isNaN(when.getTime())) {

        var h = when.getHours();

    }

    function loadTab2AstroCoords(doc) {
        if (bwTab2AstroCoords || bwTab2AstroCoordsPending) {
            return;
        }
        bwTab2AstroCoordsPending = true;
        getAdminSocketAsync(doc || parentDoc(), function (err, socket) {
            if (err || !socket) {
                bwTab2AstroCoordsPending = false;
                return;
            }
            getObjectViaAdmin(socket, 'system.adapter.javascript.0', function (eJs, jsObj) {
                getObjectViaAdmin(socket, 'system.config', function (eSys, sysObj) {
                    bwTab2AstroCoordsPending = false;
                    var js = jsObj && jsObj.native ? jsObj.native : null;
                    var sys = sysObj && sysObj.common ? sysObj.common : null;
                    function num(raw) {
                        if (raw === null || raw === undefined || raw === '') {
                            return NaN;
                        }
                        return parseFloat(String(raw).replace(',', '.'));
                    }
                    var lat = js ? num(js.latitude) : NaN;
                    var lon = js ? num(js.longitude) : NaN;
                    if (!isFinite(lat) || !isFinite(lon)) {
                        lat = sys ? num(sys.latitude) : NaN;
                        lon = sys ? num(sys.longitude) : NaN;
                    }
                    if (!isFinite(lat) || !isFinite(lon)) {
                        return;
                    }
                    bwTab2AstroCoords = { lat: lat, lon: lon };
                    var host = doc || parentDoc();
                    if (!host) {
                        return;

    }

        var legacyZeitId = schaltzeitLegacyFlatId(slot, 'Zeit');

            commitTab2ZeitFromRow(row, table);

        function scheduleCommit() {
            var cell = getCellByHeader(row, table, ['Zeit', 'Time', 'Nächste Zeitschalt']);
            applyTab2ZeitAutoFormat(input);

                var idx = getTimeRowIndex(row, table);
                var commitVal = resolveTab2ZeitCommitValue(current, idx);

                if (commitVal && isCompleteTab2ZeitValue(commitVal)) {
                    markTab2SchaltzeitNativeFromRow(row, table, { zeit: commitVal });
                }

            if (commitTimer) {
                window.clearTimeout(commitTimer);

            commitTimer = window.setTimeout(flushCommit, 450);

            } catch (eView) {}
        }
        if (socket && typeof socket.emit === 'function') {
            socket.emit('getObjectView', 'system', type, { startkey: start, endkey: end }, function (a, b) {
                var result = b !== undefined && b !== null ? b : a;
                if (typeof result === 'string') {
                    done(null, []);
                    return;
                }
                finish(result);
            });
            return;
        }
        done(null, []);
    }

    function bwFindAdapterInstances(socket, adapterName, done) {
        var start = 'system.adapter.' + adapterName + '.';
        bwQueryObjectView(socket, 'instance', start, start + '\uffff', function (_err, ids) {
            var re = new RegExp('^system\\.adapter\\.' + adapterName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\.\\d+$');
            var found = (ids || []).filter(function (id) {
                return re.test(id);
            }).map(function (id) {
                return id.replace(/^system\.adapter\./, '');
            });
            if (found.length) {
                done(null, found);
                return;
            }
            var pending = 4;
            var probed = [];
            for (var n = 0; n < 4; n += 1) {
                (function (nr) {
                    getObjectViaAdmin(socket, 'system.adapter.' + adapterName + '.' + nr, function (err, obj) {
                        if (!err && obj && obj.common) {
                            probed.push(adapterName + '.' + nr);
                        }
                        pending -= 1;
                        if (pending <= 0) {
                            done(null, probed);
                        }
                    });
                })(n);
            }
        });
    }

        try {
            url = new URL('feiertag-orte.json?v=1', window.location.href).href;
        } catch (eUrl) {}
        fetch(url).then(function (res) {
            if (!res.ok) {
                throw new Error('orte');
            }
            return res.json();
        }).then(function (data) {
            bwFeiertagOrteCache = data;
            done(null, data);
        }).catch(function () {

        });
    }

    function isJsonConfigRootComponent(comp) {

    function adminConfigComponentScore(comp) {
        if (!comp || typeof comp.setState !== 'function' || !comp.state) {
            return 0;
        }
        if (isJsonConfigComponentInstance(comp)) {
            return 100;
        }
        if (isJsonConfigRootComponent(comp)) {

    function getAdminConfigSavedBaseline(comp) {

        if (isJsonConfigComponentInstance(comp)) {

            } catch (eParse) {

        }
        if (isJsonConfigRootComponent(comp)) {
            if (comp.state.originalData) {
                delete comp._bwConfigBaseline;
                return comp.state.originalData;
            }
            if (!comp._bwConfigBaseline) {

    function findAdminConfigPublishTarget(doc) {
        var configDoc = getBeregnungswerkConfigDoc(doc);
        if (!configDoc) {
            return null;
        }
        var starts = [];
        var saveBtn = configDoc.querySelector('button[aria-label="Speichern"], button[aria-label="Save"], button.btn-save');
        if (saveBtn) {
            starts.push(saveBtn);
        }
        var adapterRoot = configDoc.querySelector('.m.adapter-beregnungswerk, .adapter-beregnungswerk');
        if (adapterRoot) {
            starts.push(adapterRoot);
        }
        var tab2Table = configDoc.querySelector('.MuiTable-root[data-bw-tab2-events-table="1"]');
        if (tab2Table) {
            starts.push(tab2Table);
        }
        var appRoot = configDoc.querySelector('.App');
        if (appRoot) {
            starts.push(appRoot);
        }
        if (configDoc.body) {
            starts.push(configDoc.body);
        }
        var seenFiber = {};
        var best = null;
        var bestScore = 0;
        function walkFiber(fiber, depth) {
            if (!fiber || depth > 260 || seenFiber[fiber]) {
                return;
            }
            seenFiber[fiber] = true;
            var node = fiber.stateNode;
            var score = adminConfigComponentScore(node);
            if (score > bestScore) {
                bestScore = score;
                best = node;
            }
            walkFiber(fiber.child, depth + 1);
            walkFiber(fiber.sibling, depth + 1);
        }
        var si;
        for (si = 0; si < starts.length; si += 1) {
            walkFiber(getReactFiberHost(starts[si]), 0);
        }
        return bestScore > 0 ? best : null;
    }

    function publishAdminConfigData(doc, data) {
        var comp = findAdminConfigPublishTarget(doc || parentDoc());
        if (!comp || !data) {
            return false;
        }
        try {
            if (isJsonConfigComponentInstance(comp)) {
                comp.onChange(data, undefined);
                return true;
            }
            if (isJsonConfigRootComponent(comp)) {
                var baseline = getAdminConfigSavedBaseline(comp);
                var changedFlag = true;
                if (baseline) {
                    try {
                        changedFlag = JSON.stringify(data) !== JSON.stringify(baseline);
                    } catch (eCmp) {
                        changedFlag = true;
                    }
                }
                comp.setState({ data: data, changed: changedFlag });
                return true;
            }
            if (comp.savedNative) {
                var legacyChanged = typeof comp.getIsChanged === 'function' ? comp.getIsChanged(data) : true;
                comp.setState({ native: data, changed: legacyChanged });
                return true;
            }
        } catch (ePub) {
            return false;
        }
        return false;
    }

    function patchTab2SchaltzeitNativeConfig(doc, slot, patch) {

        if (!comp) {

        }
        var native = cloneAdminConfigObject(getAdminConfigDataObject(comp));
        var n = parseInt(slot, 10);
        if (!Number.isFinite(n) || n < 1) {

        }
        var rowIndex = n - 1;
        var changed = false;

        function ensureTimeEventRow() {
            if (!Array.isArray(native.timeEvents)) {
                native.timeEvents = [];

            while (native.timeEvents.length <= rowIndex) {
                native.timeEvents.push(emptyTimeRowData(rowIndex));
            }
            if (!native.timeEvents[rowIndex] || typeof native.timeEvents[rowIndex] !== 'object') {
                native.timeEvents[rowIndex] = emptyTimeRowData(rowIndex);
            }
            return native.timeEvents[rowIndex];
        }

        function sanitizeAllTimeEventRows() {
            if (!Array.isArray(native.timeEvents)) {
                return;
            }
            native.timeEvents.forEach(function (row, idx) {
                sanitizeTimeEventRowZeit(row, idx);
            });
        }

        if (patch.enabled !== undefined) {
            var rowEnabled = ensureTimeEventRow();
            rowEnabled.enabled = !!patch.enabled;
            native[schaltzeitZsConfigKey(n, 'Aktiv')] = !!patch.enabled;
            changed = true;
        }
        if (patch.zeit !== undefined) {
            var rowZeit = ensureTimeEventRow();
            var zVal = normalizeTab2ZeitValue(patch.zeit, rowIndex, false);
            if (isCompleteTab2ZeitValue(zVal)) {
                rowZeit.zeit = zVal;
                native[schaltzeitZsConfigKey(n, '')] = zVal;
                changed = true;
            } else if (isTab2ZeitEmptyValue(patch.zeit)) {
                rowZeit.zeit = '';
                native[schaltzeitZsConfigKey(n, '')] = '';
                changed = true;
            }
        }
        if (patch.astro !== undefined) {
            var rowAstro = ensureTimeEventRow();
            rowAstro.astroEin = !!patch.astro;
            native[schaltzeitZsConfigKey(n, 'Astro')] = !!patch.astro;
            changed = true;
        }
        if (patch.astroTyp !== undefined) {

        if (patch.astroOffset !== undefined) {

        if (patch.tags && typeof patch.tags === 'object') {
            var rowTags = ensureTimeEventRow();
            Object.keys(patch.tags).forEach(function (suffix) {
                native[schaltzeitZsConfigKey(n, suffix)] = !!patch.tags[suffix];

    function permuteTab2Snapshot(snapshot, index, direction) {
        var next = snapshot.slice();
        var j = direction === 'up' ? index - 1 : index + 1;
        if (j < 0 || j >= next.length) {
            return next;
        }
        var tmp = next[index];
        next[index] = next[j];
        next[j] = tmp;
        return next;
    }

    function domStateToTimeEventRow(domState, index) {

        var tags = wochentagTagStatesFromTimeEventRow(domState);

        var row = {
            enabled: !!(domState && domState.enabled),
            zeit: normalizeTab2ZeitValue(domState && domState.zeit != null ? domState.zeit : '', index, false),
            wochentag: domState && domState.wochentag ? domState.wochentag : serializeWochentagTags(tags),
            astroEin: !!(domState && domState.astroEin),
            astroTyp: astro.typ,
            astroOffset: astro.offset,
            astro: domState && domState.astro
                ? domState.astro
                : serializeAstroField(astro.typ, astro.offset, slot)
        };
        allWochentagTagKeys().forEach(function (key) {
            row[key] = domState && domState[key] !== undefined ? !!domState[key] : !!tags[key];
        });
        return row;
    }

            var row = cloneAdminConfigObject(ev || {});
            sanitizeTimeEventRowZeit(row, idx);
            return row;
        });
        timeEvents.forEach(function (ev, idx) {

            var te = native.timeEvents[idx];
            if (!te) {

            native[schaltzeitZsConfigKey(slot, 'AstroTyp')] = te.astroTyp;
            native[schaltzeitZsConfigKey(slot, 'AstroOffset')] = te.astroOffset;
            var zVal = normalizeTab2ZeitValue(te.zeit, idx, false);
            if (isCompleteTab2ZeitValue(zVal)) {
                native[schaltzeitZsConfigKey(slot, '')] = zVal;
            } else {
                native[schaltzeitZsConfigKey(slot, '')] = '';
            }

    function publishTab2SnapshotToNative(table, snapshot) {
        if (!table || !Array.isArray(snapshot) || !snapshot.length) {

        var configDoc = parentDoc();
        var comp = findAdminConfigPublishTarget(configDoc);

        }

        native.timeEvents = snapshot.map(function (domState, idx) {

            var slot = idx + 1;
            var te = native.timeEvents[idx];
            native[schaltzeitZsConfigKey(slot, 'Aktiv')] = !!te.enabled;
            native[schaltzeitZsConfigKey(slot, 'Astro')] = !!te.astroEin;
            native[schaltzeitZsConfigKey(slot, 'AstroTyp')] = te.astroTyp;
            native[schaltzeitZsConfigKey(slot, 'AstroOffset')] = te.astroOffset;
            var zVal = resolveTab2ZeitCommitValue(te.zeit, idx);
            if (zVal === null) {
                zVal = normalizeTab2ZeitValue(te.zeit, idx, false);
            }
            if (isCompleteTab2ZeitValue(zVal)) {
                native[schaltzeitZsConfigKey(slot, '')] = zVal;
            } else if (isTab2ZeitEmptyValue(te.zeit) || !String(te.zeit || '').trim()) {

    function reapplyTab2RowsAfterMove(table) {
        if (!table || !isTab2VentilTable(table) || !table._bwTab2MovePending) {
            return;
        }
        var pending = table._bwTab2MovePending;
        var permuted = permuteTab2Snapshot(pending.snapshot, pending.index, pending.direction);
        applyTab2TableDomSnapshot(table, permuted);
        reapplyTab2ZeitDrafts(table);
        paintVentilNr(table);
        reorderActions(table);
    }

    function wireTab2RowMovePreserve(table) {
        if (!table || !isTab2VentilTable(table) || table._bwTab2MovePreserveBound) {
            return;
        }
        table._bwTab2MovePreserveBound = true;
        table.addEventListener('mousedown', function (e) {
            var upWrap = e.target.closest('[data-bw-role="up"][data-bw-show="1"]:not([data-bw-disabled="1"])');
            var downWrap = e.target.closest('[data-bw-role="down"][data-bw-show="1"]:not([data-bw-disabled="1"])');
            var wrap = upWrap || downWrap;
            if (!wrap) {
                return;
            }
            var row = wrap.closest('.MuiTableRow-root, tr');
            if (!row || !isDataRow(row)) {
                return;
            }
            var rows = getVentilDataRows(table);
            var idx = rows.indexOf(row);
            if (idx < 0) {
                return;
            }
            if (upWrap && idx === 0) {
                return;
            }
            if (downWrap && idx >= rows.length - 1) {
                return;
            }
            flushTab2ZeitInputsFromTable(table);
            table._bwTab2MovePending = {
                snapshot: collectTab2TableDomSnapshot(table),
                index: idx,
                direction: upWrap ? 'up' : 'down'
            };
            [40, 120, 260].forEach(function (delay, attempt, attempts) {
                window.setTimeout(function () {
                    if (!table._bwTab2MovePending) {
                        return;
                    }
                    reapplyTab2RowsAfterMove(table);
                    if (attempt === attempts.length - 1) {
                        table._bwTab2MovePending = null;
                    }
                }, delay);
            });
        }, true);
    }

    function commitTab2ZeitFromRow(row, table, options) {
        if (!row || !table || !isTab2VentilTable(table)) {
            return;
        }
        if (options && options.initial) {
            return;
        }
        if (row.getAttribute('data-bw-zeit-sync') === '1' && !(options && options.force)) {
            return;
        }
        var idx = getTimeRowIndex(row, table);
        var zVal = resolveTab2ZeitCommitValue(readTab2ZeitCellValue(row, table), idx);
        var cell = getCellByHeader(row, table, ['Zeit', 'Time', 'Nächste Zeitschalt']);
        if (zVal === null) {
            return;
        }
        if (!options || !options.force) {
            if (cell && cell.getAttribute('data-bw-zeit-dp-synced') === '1' &&
                cell.getAttribute('data-bw-zeit-dp-value') === zVal) {
                return;
            }
        }
        row.setAttribute('data-bw-zeit-sync', '1');
        pushTimeZeitState(row, table, zVal, function (setErr) {
            if (!setErr && cell) {
                cell.setAttribute('data-bw-zeit-dp-value', zVal);
                cell.setAttribute('data-bw-zeit-dp-synced', '1');
                if (isCompleteTab2ZeitValue(zVal)) {
                    saveTab2ZeitDraft(cell, cell.querySelector('input, .MuiInputBase-input'), zVal);
                } else if (zVal === tab2ZeitDpValueForEmpty()) {
                    cell.removeAttribute('data-bw-zeit-draft');
                }
            } else if (cell) {
                cell.removeAttribute('data-bw-zeit-dp-synced');
                cell.removeAttribute('data-bw-zeit-dp-value');
            }
            window.setTimeout(function () {
                row.removeAttribute('data-bw-zeit-sync');
            }, 0);
        }, options);
    }

    function pushTimeZeitState(row, table, zeitValue, done, opts) {
        var idx = getTimeRowIndex(row, table);
        var slot = idx + 1;
        var doc = parentDoc() || (row ? row.ownerDocument : null);
        var zVal = normalizeTab2ZeitValue(zeitValue, idx, false);
        if (isTab2ZeitEmptyValue(zVal)) {
            zVal = tab2ZeitDpValueForEmpty();
        } else if (!isCompleteTab2ZeitValue(zVal)) {
            if (done) {
                done(new Error('Ungültige Schaltzeit'));
            }
            return;
        }
        var cell = getCellByHeader(row, table, ['Zeit', 'Time', 'Nächste Zeitschalt']);
        markActiveUserChange(row);
        if (!opts || !opts.skipNative) {
            markTab2SchaltzeitNativeFromRow(row, table, { zeit: zVal });
        }
        getAdminSocketAsync(doc, function (err, socket) {
            if (err || !socket) {
                if (done) {
                    done(err || new Error('Keine Admin-Verbindung'));
                }
                return;
            }
            var writeIds = schaltzeitZeitWriteStateIds(slot, cell);
            var writePos = 0;
            var hadSuccess = false;
            var lastErr = null;
            function finishAll() {
                if (hadSuccess) {
                    if (cell) {
                        cell.setAttribute('data-bw-zeit-state-id', writeIds[0]);
                    }
                    if (done) {
                        done(null);
                    }
                    return;
                }
                if (lastErr && isMissingStateError(lastErr)) {
                    ensureSchaltzeitStatesForNr(slot, function (ensureErr) {
                        if (ensureErr) {
                            if (done) {
                                done(ensureErr);
                            }
                            return;
                        }
                        setStateViaAdmin(socket, schaltzeitZeitStateId(slot), zVal, function (retryErr) {
                            if (done) {
                                done(retryErr);
                            }
                        });
                    });
                    return;
                }
                if (done) {
                    done(lastErr || new Error('setState fehlgeschlagen'));
                }
            }
            function writeNext() {
                if (writePos >= writeIds.length) {
                    finishAll();
                    return;
                }
                var sid = writeIds[writePos];
                writePos += 1;
                setStateViaAdmin(socket, sid, zVal, function (setErr) {
                    if (!setErr) {
                        hadSuccess = true;
                    } else {
                        lastErr = setErr;
                        try {
                            console.warn('pushTimeZeitState setState:', sid, setErr);
                        } catch (eLog) {}
                    }
                    writeNext();
                });
            }
            writeNext();
        });
    }

    function getSchleifeVentilSlot(row, table) {

    var BW_OID_DUP_WARN_ID = 'bw-oid-dup-warn';
    var BW_OID_DUP_WARN_TEXT = 'Gleiche Objekt-ID (Ausgang) in mehreren Zeilen – „Aktiv“ ist deaktiviert.';

    function normalizeObjectIdKey(value) {
        return String(value == null ? '' : value).trim();
    }

    function buildObjectIdDuplicateMap(table) {
        var counts = {};
        getVentilDataRows(table).forEach(function (row) {
            var cell = getObjectIdCell(row, table);
            var key = normalizeObjectIdKey(getObjectIdCellValue(cell));
            if (!key) {
                return;
            }
            counts[key] = (counts[key] || 0) + 1;
        });
        var dups = {};
        Object.keys(counts).forEach(function (key) {
            if (counts[key] > 1) {
                dups[key] = true;
            }
        });
        return dups;
    }

    function isRowObjectIdDuplicate(row, table, dupMap) {
        if (!row || !table) {
            return false;
        }
        var map = dupMap || buildObjectIdDuplicateMap(table);
        var cell = getObjectIdCell(row, table);
        var key = normalizeObjectIdKey(getObjectIdCellValue(cell));
        return !!(key && map[key]);
    }

    function hasObjectIdDuplicates(table) {
        return Object.keys(buildObjectIdDuplicateMap(table)).length > 0;
    }

    function setActiveToggleDuplicateBlocked(row, blocked) {
        var cell = getActiveCell(row);
        if (!cell) {
            return;
        }
        var toggle = cell.querySelector('[data-bw-active-toggle="1"]');
        if (!toggle) {
            return;
        }
        if (blocked) {
            toggle.setAttribute('data-bw-oid-dup-blocked', '1');
            toggle.style.setProperty('opacity', '0.55', 'important');
            toggle.style.setProperty('cursor', 'not-allowed', 'important');
        } else {
            toggle.removeAttribute('data-bw-oid-dup-blocked');
            toggle.style.removeProperty('opacity');
            toggle.style.removeProperty('cursor');
        }
    }

    function enforceDuplicateObjectIdActiveRules(table) {
        if (!table) {
            return false;
        }
        var dupMap = buildObjectIdDuplicateMap(table);
        var hasDup = Object.keys(dupMap).length > 0;
        getVentilDataRows(table).forEach(function (row) {
            var isDup = isRowObjectIdDuplicate(row, table, dupMap);
            row.setAttribute('data-bw-oid-dup', isDup ? '1' : '0');
            setActiveToggleDuplicateBlocked(row, isDup);
            if (isDup) {
                var activeCell = getActiveCell(row);
                if (activeCell && readActiveChecked(activeCell)) {
                    applySchleifeActiveToRow(row, table, false);
                    pushVentilActiveStates(row, table, false);
                }
            }
        });
        return hasDup;
    }

    function findObjectIdDuplicateWarningHost(table) {

        }
        return table.closest('.MuiGrid-item, .MuiGrid2-root, [class*="MuiGrid"]') || table.parentElement;
    }

    function ensureObjectIdDuplicateWarning(table, doc, show) {
        if (!table || !doc) {
            return;
        }
        var host = findObjectIdDuplicateWarningHost(table);
        if (!host) {
            return;
        }
        var el = host.querySelector('#' + BW_OID_DUP_WARN_ID);

                el.style.setProperty('display', 'none', 'important');

        }

            el.id = BW_OID_DUP_WARN_ID;
            el.className = 'bw-oid-dup-warn';
            el.setAttribute('role', 'alert');
            el.textContent = BW_OID_DUP_WARN_TEXT;
            host.insertBefore(el, table);
        }
        el.style.setProperty('display', 'block', 'important');

    function flashObjectIdDuplicateHint(table) {
        if (!table) {

        }
        var doc = parentDoc() || (table.ownerDocument || document);
        ensureObjectIdDuplicateWarning(table, doc, true);
    }

    function refreshObjectIdDuplicateState(table, doc) {
        if (!table || table.getAttribute('data-bw-events-table') !== '1') {
            return;
        }
        var hasDup = enforceDuplicateObjectIdActiveRules(table);
        ensureObjectIdDuplicateWarning(table, doc || parentDoc(), hasDup);

    function wireObjectIdDuplicateWatch(table) {
        if (!table || table._bwOidDupBound) {
            return;
        }
        table._bwOidDupBound = true;
        function onOidFieldChange(e) {
            var row = e.target.closest('.MuiTableRow-root, tr');
            if (!row || !isDataRow(row)) {
                return;
            }
            var oidCell = getObjectIdCell(row, table);
            if (!oidCell || !oidCell.contains(e.target)) {
                return;
            }
            row.setAttribute('data-bw-oid-user', '1');
            markActiveUserChange(row);

    var bwSchleifeSyncTimer = null;

    function syncAllSchleifeActiveFromDp(table, doc) {
        if (!table) {
            return;
        }
        var rows = getVentilDataRows(table);
        getAdminSocketAsync(doc || parentDoc(), function (err, socket) {
            if (err || !socket) {
                refreshObjectIdDuplicateState(table, doc);
                return;
            }
            var pending = 0;
            rows.forEach(function (row, idx) {
                if (idx >= BW_SCHLEIFE_VENTIL_MAX) {
                    return;
                }
                if (row.getAttribute('data-bw-active-user') === '1') {
                    return;
                }
                pending += 1;
                var slot = idx + 1;
                getStateViaAdmin(socket, schleifeVentilDpId(slot), function (errState, state) {
                    var val = false;
                    if (!errState && state && Object.prototype.hasOwnProperty.call(state, 'val')) {
                        val = !!state.val;
                    }
                    applySchleifeActiveToRow(row, table, val);
                    pending -= 1;
                    if (pending <= 0) {
                        refreshObjectIdDuplicateState(table, doc);
                    }
                });
            });
            if (pending <= 0) {
                refreshObjectIdDuplicateState(table, doc);
            }
        });
    }

    function scheduleSyncAllSchleifeActiveFromDp(table, doc) {
        if (!table || table._bwSchleifeSyncDone) {
            return;
        }
        if (bwSchleifeSyncTimer) {
            window.clearTimeout(bwSchleifeSyncTimer);
        }
        bwSchleifeSyncTimer = window.setTimeout(function () {
            bwSchleifeSyncTimer = null;
            syncAllSchleifeActiveFromDp(table, doc);
            table._bwSchleifeSyncDone = true;
        }, 100);
    }

    /** Schwelle.Vergleich: false/unten = untere Schwelle, true/oben = obere Schwelle */
    function parseVergleichOben(val, fallbackOben) {
        if (fallbackOben == null) {
            fallbackOben = true;
        }
        var s = String(val != null ? val : '').trim().toLowerCase();
        if (s === 'untere schwelle' || s === 'untere' || s === 'unten' || s === '0' || s === 'false') {
            return false;
        }
        if (s === 'obere schwelle' || s === 'obere' || s === 'oben' || s === '1' || s === 'true') {
            return true;
        }
        if (val === false || val === 0) {
            return false;
        }
        if (val === true || val === 1) {
            return true;
        }
        return !!fallbackOben;
    }

    function ventilFieldDefault(field) {
        if (field.type === 'checkbox' || field.type === 'vergleich') {
            return false;
        }
        if (field.type === 'number') {
            return 0;
        }
        return '';
    }

    function isMissingStateError(err) {
        if (!err) {
            return false;
        }
        var msg = String(err).toLowerCase();
        return msg.indexOf('not exist') >= 0 ||
            msg.indexOf('not found') >= 0 ||
            msg.indexOf('unknown') >= 0 ||
            msg.indexOf('nicht') >= 0 ||
            msg.indexOf('existiert nicht') >= 0;
    }

    function readVentilStateValue(field, sid, err, state) {
        if (err && !isMissingStateError(err)) {
            return { val: ventilFieldDefault(field), err: sid + ': ' + err };
        }
        if (!state || !Object.prototype.hasOwnProperty.call(state, 'val')) {
            return { val: ventilFieldDefault(field), err: null };
        }
        if (state.id && state.id !== sid) {
            return { val: ventilFieldDefault(field), err: null };
        }
        if (field.type === 'vergleich') {
            return { val: parseVergleichOben(state.val, false), err: null };
        }
        return { val: state.val, err: null };
    }

    function loadVentilConfigValues(socket, nr, done) {
        var values = {};
        var errors = [];
        var pending = BW_VENTIL_FIELDS.length;
        var finished = false;
        if (!pending) {
            done(null, values, errors);
            return;
        }
        var timer = window.setTimeout(function () {
            if (finished) {
                return;
            }
            finished = true;
            errors.push('Zeitüberschreitung beim Laden der Datenpunkte.');
            done(null, values, errors);
        }, 12000);
        function finishOne() {
            if (pending > 0 || finished) {
                return;
            }
            finished = true;
            window.clearTimeout(timer);
            done(null, values, errors);
        }
        BW_VENTIL_FIELDS.forEach(function (field) {
            var sid = ventilDpId(nr, field.path);
            getStateViaAdmin(socket, sid, function (err, state) {
                pending -= 1;
                var parsed = readVentilStateValue(field, sid, err, state);
                values[sid] = parsed.val;
                if (parsed.err) {
                    errors.push(parsed.err);
                }
                finishOne();
            });
        });
    }

    function fitOidInputWidth(inp) {
        if (!inp) {
            return;
        }
        var len = String(inp.value || '').length;
        var chars = Math.max(22, len + 2);
        if (chars > 64) {
            chars = 64;
        }
        inp.style.width = 'auto';
        inp.style.flex = '1 1 auto';
        inp.style.minWidth = chars + 'ch';
        inp.style.maxWidth = 'none';
    }

    function appendVentilFieldControl(uiDoc, hostDoc, socket, nr, field, val, container, row, table) {
        var sid = ventilDpId(nr, field.path);

            }

            }

        function refreshLiveIfOid() {
            if (field.type !== 'oid') {
                return;
            }

                refreshVentilLivePanel(panel, socket, nr);

        var wrap = uiDoc.createElement('div');

            (field.type === 'checkbox' ? ' bw-vip-field-check' : '') +
            (field.group === 'obj-feucht' || field.group === 'obj-temp' ? ' bw-vip-field-threshold' : '');
        if (field.label && !field.hideLabel) {
            appendVipFieldHead(uiDoc, wrap, field);
        }

        if (field.type === 'checkbox') {
            var checkWrap = uiDoc.createElement('label');
            checkWrap.className = field.hideLabel
                ? 'bw-vip-check bw-vip-check-inline-head'

            var cb = uiDoc.createElement('input');
            cb.type = 'checkbox';
            cb.checked = !!val;
            cb.addEventListener('change', function () {
                setStateViaAdmin(socket, sid, cb.checked, function (err) {
                    if (err) {
                        alertVentilErr(hostDoc, err);
                        return;
                    }

                });

            checkWrap.appendChild(cb);

            } else if (field.label) {
                checkWrap.appendChild(uiDoc.createTextNode(' ' + field.label));
            }
            wrap.appendChild(checkWrap);
        } else if (field.type === 'oid') {
            var oidWrap = uiDoc.createElement('div');
            oidWrap.className = 'bw-vip-oid-wrap';
            var inp = uiDoc.createElement('input');
            inp.type = 'text';
            inp.className = 'bw-vip-input bw-vip-oid';
            inp.value = val != null ? String(val) : '';
            fitOidInputWidth(inp);
            inp.addEventListener('input', function () {
                fitOidInputWidth(inp);
                refreshLiveIfOid();
            });
            var pick = uiDoc.createElement('button');
            pick.type = 'button';
            pick.className = 'bw-vip-picker';
            pick.textContent = '…';
            pick.title = 'Objekt-ID wählen';
            function saveOid() {
                setStateViaAdmin(socket, sid, inp.value.trim(), function (err) {
                    if (err) {
                        alertVentilErr(hostDoc, err);
                        return;
                    }
                    refreshLiveIfOid();
                });
            }
            inp.addEventListener('change', saveOid);
            pick.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                if (row && table) {
                    var opened = openNativeRowObjectIdPicker(row, table, inp.value.trim(), function (chosen) {
                        inp.value = chosen || '';
                        fitOidInputWidth(inp);
                        inp.dispatchEvent(new Event('input', { bubbles: true }));
                        inp.dispatchEvent(new Event('change', { bubbles: true }));
                        saveOid();
                        refreshLiveIfOid();
                    });
                    if (opened) {
                        return;
                    }
                }
                alertVentilErr(hostDoc, 'Objektauswahl nicht verfügbar – bitte „…“ in der Tabellen-Spalte Objekt-ID verwenden.');

            oidWrap.appendChild(inp);
            oidWrap.appendChild(pick);
            wrap.appendChild(oidWrap);
        } else if (field.type === 'vergleich') {
            var box = uiDoc.createElement('div');
            box.className = 'bw-vip-compare-box';
            var radios = uiDoc.createElement('div');
            radios.className = 'bw-vip-compare-radios';
            var radioName = 'bw-vip-vergleich-' + nr + '-' + String(Math.random()).slice(2);
            [
                { val: '0', title: 'Unten', meta: 'untere Schwelle', hint: 'Wert darunter erlaubt Start', oben: false },
                { val: '1', title: 'Oben', meta: 'obere Schwelle', hint: 'Wert darüber sperrt', oben: true }
            ].forEach(function (opt) {
                var rl = uiDoc.createElement('label');
                rl.className = 'bw-vip-radio';
                var rb = uiDoc.createElement('input');
                rb.type = 'radio';
                rb.name = radioName;
                rb.value = opt.val;
                rb.checked = parseVergleichOben(val, false) === opt.oben;
                rb.addEventListener('change', function () {
                    setStateViaAdmin(socket, sid, rb.value === '1', function (err) {
                        if (err) {
                            alertVentilErr(hostDoc, err);
                            return;
                        }
                        refreshLiveIfSchwelle();
                    });
                });
                rl.appendChild(rb);
                var textWrap = uiDoc.createElement('span');
                textWrap.className = 'bw-vip-radio-text';
                textWrap.innerHTML =
                    escapeHtml(opt.title) + ' <span class="bw-vip-subgroup-meta">(' + escapeHtml(opt.meta) + ')</span>' +
                    '<br><span class="bw-vip-subgroup-meta">(' + escapeHtml(opt.hint) + ')</span>';
                rl.appendChild(textWrap);
                radios.appendChild(rl);
            });
            box.appendChild(radios);
            wrap.appendChild(box);
        } else {
            var numWrap = uiDoc.createElement('div');
            numWrap.className = 'bw-vip-input-with-unit';
            var num = uiDoc.createElement('input');
            num.type = 'number';
            num.className = 'bw-vip-input bw-vip-input-num';
            if (field.min != null) {
                num.min = String(field.min);
            }
            if (field.max != null) {
                num.max = String(field.max);
            }
            if (field.step != null) {
                num.step = String(field.step);
            }
            num.value = val != null ? String(val) : '';
            num.addEventListener('change', function () {
                var parsed = parseFloat(num.value);
                if (isNaN(parsed)) {
                    return;
                }
                setStateViaAdmin(socket, sid, parsed, function (err) {
                    if (err) {
                        alertVentilErr(hostDoc, err);
                        return;
                    }
                    refreshLiveIfSchwelle();
                });
            });
            numWrap.appendChild(num);
            if (field.unit && !(field.labelMeta && (field.group === 'water' || field.group === 'obj-feucht' || field.group === 'obj-temp'))) {
                var unitEl = uiDoc.createElement('span');
                unitEl.className = 'bw-vip-input-unit';
                unitEl.textContent = field.unit;
                numWrap.appendChild(unitEl);
            }
            wrap.appendChild(numWrap);
        }
        container.appendChild(wrap);
    }

    function countVentilTableColumns(table) {

        if (!headRow) {
            return 6;
        }

    function formatVentilLiveDisplay(row, val) {
        if (row.type === 'checkbox') {
            return val ? 'Ein' : 'Aus';
        }
        if (row.type === 'indicator') {
            return val ? 'Ja' : 'Nein';
        }
        if (row.type === 'sensor') {
            if (val === null || val === undefined || val === '') {
                return '';
            }
            var sn = Number(val);
            if (!Number.isNaN(sn)) {
                var st = row.unit === '\u00B0C' ? sn.toFixed(1) : String(Math.round(sn * 10) / 10);
                return row.unit ? st + ' ' + row.unit : st;
            }
            return String(val);
        }
        if (row.type === 'vergleich') {
            return parseVergleichOben(val, false) ? 'Oben' : 'Unten';
        }
        if (row.type === 'number') {
            if (val === null || val === undefined || val === '') {
                return '—';
            }
            var num = Number(val);
            if (Number.isNaN(num)) {
                return String(val);
            }
            var text = row.unit === '\u00B0C' ? num.toFixed(1) : String(num);
            return row.unit ? text + ' ' + row.unit : text;
        }
        return val == null || val === '' ? '—' : String(val);
    }

    function updateVentilLiveValEl(valEl, row, val) {
        if (!valEl) {
            return;
        }
        valEl.textContent = formatVentilLiveDisplay(row, val);
        valEl.classList.remove('bw-live-on', 'bw-live-off', 'bw-live-alarm');
        if (row.type === 'checkbox') {
            valEl.classList.add(val ? 'bw-live-on' : 'bw-live-off');
        } else if (row.type === 'indicator') {
            valEl.classList.add(val ? 'bw-live-alarm' : 'bw-live-on');
        }
    }

    function readOidFromPanelInput(panel, sensorPath) {
        if (!panel || !sensorPath) {
            return '';
        }
        var group = sensorPath === 'Konfig.FeuchtigkeitSensor' ? 'obj-feucht' : 'obj-temp';
        var host = panel.querySelector('[data-bw-vip-group="' + group + '"]');
        var inp = host ? host.querySelector('input.bw-vip-oid') : null;
        return inp ? String(inp.value || '').trim() : '';
    }

    function refreshVentilLiveRow(panel, socket, nr, row, valEl, done) {
        if (!valEl || !valEl.isConnected) {
            if (typeof done === 'function') {
                done();
            }
            return;
        }
        if (row.type === 'sensor' && row.sensorPath) {
            var cfgId = ventilDpId(nr, row.sensorPath);
            getStateViaAdmin(socket, cfgId, function (err, cfgState) {
                if (!valEl.isConnected) {
                    if (typeof done === 'function') {
                        done();
                    }
                    return;
                }
                var oid = '';
                if (!isTimeoutError(err) && cfgState && cfgState.val != null) {
                    oid = String(cfgState.val).trim();
                }
                if (!oid) {
                    oid = readOidFromPanelInput(panel, row.sensorPath);
                }
                if (!oid) {
                    updateVentilLiveValEl(valEl, row, null);
                    if (typeof done === 'function') {
                        done();
                    }
                    return;
                }
                getStateViaAdmin(socket, oid, function (err2, sensorState) {
                    if (valEl.isConnected && !isTimeoutError(err2)) {
                        var sv = sensorState && Object.prototype.hasOwnProperty.call(sensorState, 'val')
                            ? sensorState.val
                            : null;
                        updateVentilLiveValEl(valEl, row, sv);
                    }
                    if (typeof done === 'function') {
                        done();
                    }
                });
            });
            return;
        }
        var sid = ventilDpId(nr, row.path);
        getStateViaAdmin(socket, sid, function (err, state) {
            if (valEl.isConnected && !isTimeoutError(err)) {
                var field = { type: row.type, unit: row.unit };
                var parsed = readVentilStateValue(field, sid, err, state);
                updateVentilLiveValEl(valEl, row, parsed.val);
            }
            if (typeof done === 'function') {
                done();
            }
        });
    }

    function refreshVentilLivePanel(panel, socket, nr) {
        var livePanel = panel && panel.querySelector('[data-bw-vip-live-panel="1"]');
        if (!livePanel || !socket || !nr) {
            return;
        }
        var idx = 0;
        function next() {
            if (!livePanel.isConnected || idx >= BW_VENTIL_LIVE_ROWS.length) {
                return;
            }
            var row = BW_VENTIL_LIVE_ROWS[idx];
            idx += 1;
            var valEl = livePanel.querySelector('[data-bw-live-key="' + row.key + '"] [data-bw-live-val]');
            refreshVentilLiveRow(panel, socket, nr, row, valEl, function () {
                window.setTimeout(next, 50);
            });
        }
        next();
    }

    function stopVentilLivePanel(panel) {
        if (!panel) {
            return;
        }
        if (panel._bwLiveTimer) {
            window.clearInterval(panel._bwLiveTimer);
            panel._bwLiveTimer = null;
        }
    }

    function wireVentilLivePanel(panel, socket, nr) {
        stopVentilLivePanel(panel);
        if (!panel || !panel.querySelector('[data-bw-vip-live-panel="1"]')) {
            return;
        }
        refreshVentilLivePanel(panel, socket, nr);
        panel._bwLiveTimer = window.setInterval(function () {
            if (!panel.isConnected) {
                stopVentilLivePanel(panel);
                return;
            }
            refreshVentilLivePanel(panel, socket, nr);
        }, 2500);
    }

    function populateInlineVentilPanel(panel, hostDoc, socket, nr, row, table) {
        var statusEl = panel.querySelector('.bw-vip-apply-status');
        clearVentilPanelHosts(panel, true);
        loadVentilConfigValues(socket, nr, function (err, values, errors) {
            clearVentilPanelHosts(panel, false);
            if (statusEl) {
                if (errors && errors.length) {
                    statusEl.textContent = errors.join(' ');
                    statusEl.classList.remove('bw-apply-ok');
                } else {
                    statusEl.textContent = '';
                }
            }
            renderVentilFieldsInto(panel.ownerDocument, hostDoc, socket, nr, values, panel, row, table);
            bindWartungControl(panel, hostDoc, socket, nr, row, table);
            bindParallelControl(panel, hostDoc, socket, nr, row, table);
            wireVentilLivePanel(panel, socket, nr);
            panel.querySelectorAll('.bw-vip-apply, .bw-vip-picker').forEach(function (btn) {
                ensurePressable3D(btn);
            });
        });
    }

    function closeVentilConfigModal(doc) {
        collectAdapterDocs(doc).forEach(function (d) {
            var el = d.getElementById('bw-ventil-config-backdrop');
            if (el) {
                el.remove();
            }
        });
    }

    function showVentilConfigModal(hostDoc, socket, nr) {
        var modalDoc = resolvePickerDocument(hostDoc);
        closeVentilConfigModal(hostDoc);
        if (!modalDoc || !modalDoc.body || !socket || !nr) {
            return;
        }
        var backdrop = modalDoc.createElement('div');
        backdrop.id = 'bw-ventil-config-backdrop';

    function getVentilNrFromRow(row, table, rowIndex) {
        if (table && isTab1VentilTable(table)) {

            if (ident > 0) {
                return ident;
            }
        }
        var cell = getNrCell(row, table);
        if (cell) {
            var fromAttr = cell.getAttribute('data-bw-nr');
            if (fromAttr) {
                var na = parseInt(fromAttr, 10);
                if (!isNaN(na) && na >= 1) {
                    return na;
                }
            }
            var fromCell = parseInt(readCellTextPlain(cell), 10);
            if (!isNaN(fromCell) && fromCell >= 1) {
                return fromCell;
            }
        }
        var ri = rowIndex;
        if (ri == null || ri < 0) {
            ri = getDataRowIndex(row, row ? row.ownerDocument : null);
        }
        return (ri >= 0 ? ri : 0) + 1;
    }

    function getVentilHeaderGridItem(el) {

    function findVentilHeaders(doc) {
        var root = doc.querySelector('.m.adapter-beregnungswerk, .adapter-beregnungswerk');
        if (!root) {
            return [];
        }
        var out = [];
        var seen = {};
        var nodes = root.querySelectorAll('.MuiGrid-item, h1, h2, h3, h4, h5, h6, .MuiTypography-root');
        var i;
        var text;
        var m;
        for (i = 0; i < nodes.length; i++) {
            if (nodes[i].children.length > 8) {
                continue;
            }
            text = (nodes[i].textContent || '').replace(/\s+/g, ' ').trim();
            if (text.length > 100) {
                continue;
            }
            m = text.match(/^Ventil\s+([1-4])\s+[–\-]\s+Bew/i) ||
                text.match(/^Valve\s+([1-4])\s+[–\-]\s+water/i);
            if (!m || seen[m[1]]) {
                continue;
            }
            seen[m[1]] = true;
            out.push({ nr: parseInt(m[1], 10), el: nodes[i] });
        }
        out.sort(function (a, b) {
            if (a.el === b.el) {
                return 0;
            }
            return (a.el.compareDocumentPosition(b.el) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1;
        });
        return out;
    }

    function findVentilInfoItems(doc) {

            var t = (item.textContent || '').trim();
            if (t.indexOf('direkt mit beregnungswerk') >= 0 || t.indexOf('bound directly') >= 0) {
                items.push(item);
            }
        });
        return items;
    }

    function findInjectGridIndex(allItems) {

                return i;

    function gridItemVentilNr(item) {
        if (!item) {
            return 0;
        }
        var html = item.innerHTML || '';
        var m = html.match(/ventil([1-4])(?:Dauer|Wdh|Feucht|Temp|Vergleich|Header|Shw)/i);
        if (m) {
            return parseInt(m[1], 10);
        }
        m = html.match(/Ventil([1-4])\./);
        if (m) {
            return parseInt(m[1], 10);
        }
        var attrs = item.querySelectorAll('[id], [name], label[for]');
        var i;
        var s;
        for (i = 0; i < attrs.length; i += 1) {
            s = (attrs[i].id || '') + (attrs[i].name || '') + (attrs[i].getAttribute('for') || '');
            m = s.match(/ventil([1-4])/i);
            if (m) {
                return parseInt(m[1], 10);
            }
        }
        var text = (item.textContent || '').replace(/\s+/g, ' ').trim();
        if (text.length > 100) {
            return 0;
        }
        m = text.match(/^Ventil\s+([1-4])\s+[–\-]\s+Bew/i) ||
            text.match(/^Valve\s+([1-4])\s+[–\-]\s+water/i);
        if (m) {
            return parseInt(m[1], 10);
        }
        return 0;
    }

    function tagVentilGridItem(item, nr) {
        if (!item || nr < 1 || nr > 4) {

    function tagAllVentilGridItems(doc) {
        var tagged = tagVentilGrid2Siblings(doc);
        if (tagged > 0) {
            return tagged;
        }
        var root = getAdapterRoot(doc);
        if (!root) {
            return 0;
        }
        var allItems = [];
        root.querySelectorAll('.MuiGrid2-root, .MuiGrid-item').forEach(function (item) {
            if (item.parentElement && item.parentElement.querySelector('.MuiTable-root')) {
                allItems.push(item);
            }
        });
        if (!allItems.length) {
            root.querySelectorAll('.MuiGrid2-root, .MuiGrid-item').forEach(function (item) {
                allItems.push(item);
            });
        }
        var built = buildVentilSectionsFallback(doc, allItems);
        var i;
        var j;
        for (i = 0; i < built.sections.length; i += 1) {
            for (j = 0; j < built.sections[i].items.length; j += 1) {
                tagVentilGridItem(built.sections[i].items[j], built.sections[i].nr);
                tagged += 1;
            }
        }
        return tagged;
    }

    function buildVentilSectionsFallback(doc, allItems) {
        var sections = [];
        var infoItems = [];
        var byNr = { 1: [], 2: [], 3: [], 4: [] };
        var tableIdx = -1;
        var i;
        for (i = 0; i < allItems.length; i += 1) {
            if (allItems[i].querySelector('.MuiTable-root')) {
                tableIdx = i;
            }
        }
        var start = tableIdx >= 0 ? tableIdx + 1 : 0;
        for (i = start; i < allItems.length; i += 1) {
            if (allItems[i].querySelector('iframe[src*="beregnungswerk"]')) {
                break;
            }
            var t = (allItems[i].textContent || '').trim();
            if (t.indexOf('direkt mit beregnungswerk') >= 0 || t.indexOf('bound directly') >= 0) {
                infoItems.push(allItems[i]);
                continue;
            }
            var nr = gridItemVentilNr(allItems[i]);
            if (nr >= 1 && nr <= 4) {
                byNr[nr].push(allItems[i]);
            }
        }
        for (i = 1; i <= 4; i += 1) {
            if (byNr[i].length) {
                sections.push({ nr: i, items: byNr[i] });
            }
        }
        return { sections: sections, infoItems: infoItems, allVentilItems: [] };
    }

    function buildVentilSections(doc) {
        var root = doc.querySelector('.m.adapter-beregnungswerk, .adapter-beregnungswerk');
        if (!root) {
            return { sections: [], infoItems: [], allVentilItems: [] };
        }
        var allItems = [];
        root.querySelectorAll('.MuiGrid-item, .MuiGrid2-root').forEach(function (item) {
            allItems.push(item);
        });
        var headers = findVentilHeaders(doc);
        var injectIdx = findInjectGridIndex(allItems);
        var sections = [];
        var allVentilItems = [];
        var hi;
        for (hi = 0; hi < headers.length; hi += 1) {
            var startGi = getVentilHeaderGridItem(headers[hi].el);
            var endGi = hi + 1 < headers.length ? getVentilHeaderGridItem(headers[hi + 1].el) : null;
            var startIdx = allItems.indexOf(startGi);
            var endIdx = endGi ? allItems.indexOf(endGi) : injectIdx;
            if (startIdx < 0) {
                continue;
            }
            if (endIdx < 0 || endIdx < startIdx) {
                endIdx = injectIdx;
            }
            var slice = allItems.slice(startIdx, endIdx);
            sections.push({ nr: headers[hi].nr, items: slice });
            allVentilItems = allVentilItems.concat(slice);
        }
        if (!sections.length) {
            return buildVentilSectionsFallback(doc, allItems);
        }
        return {
            sections: sections,
            infoItems: findVentilInfoItems(doc),
            allVentilItems: allVentilItems
        };
    }

    function collectAdapterDocs(startDoc) {
        var docs = [];
        var seen = [];
        function addDoc(d) {
            if (!d || seen.indexOf(d) >= 0) {
                return;
            }
            seen.push(d);
            docs.push(d);
        }
        addDoc(startDoc);
        var w = startDoc && startDoc.defaultView;
        var i;
        for (i = 0; i < 16 && w; i += 1) {
            try {
                if (w.parent && w.parent !== w) {
                    w = w.parent;
                    addDoc(w.document);
                } else {
                    break;
                }
            } catch (e) {
                break;
            }
        }
        return docs;
    }

    function findVentilDetailTarget(doc, nr) {
        if (!doc) {
            return null;
        }
        var anchor = doc.getElementById('bw-ventil-section-' + nr) ||
            doc.querySelector('[data-bw-ventil-section="' + nr + '"]');
        if (anchor) {
            return anchor;
        }
        var root = doc.querySelector('.m.adapter-beregnungswerk, .adapter-beregnungswerk') || doc.body;
        var re = new RegExp('Ventil\\s+' + nr + '\\s+[–\\-]\\s+Bew', 'i');
        var reEn = new RegExp('Valve\\s+' + nr + '\\s+[–\\-]\\s+water', 'i');
        var els = root.querySelectorAll('h1,h2,h3,h4,h5,h6,.MuiTypography-root,label,span,div');
        var i;
        var text;
        for (i = 0; i < els.length; i++) {
            if (els[i].children.length > 4) {
                continue;
            }
            text = (els[i].textContent || '').replace(/\s+/g, ' ').trim();
            if (text.length > 90) {
                continue;
            }
            if (re.test(text) || reEn.test(text)) {
                return els[i];
            }
        }
        return null;
    }

    function finishCloneVentilRow(table, sourceRow, newRow) {
        if (!table || !sourceRow || !newRow) {
            return;
        }
        var sourceData = readRowDataFromDom(sourceRow, table);
        resolveNextVentilNr(table, newRow, function (err, ventilNr) {
            if (err || !ventilNr) {
                ventilNr = 1;
            }
            if (isTab2VentilTable(table)) {
                var cloneIdx = getVentilDataRows(table).indexOf(newRow);
                var cloneData = {
                    enabled: sourceData.enabled,
                    zeit: sourceData.zeit || defaultSchaltzeitZeitForRowIndex(cloneIdx)
                };
                writeRowDataToDom(newRow, table, cloneData);
                reapplyRowDataToDom(newRow, table, cloneData);
            } else if (isPumpTable(table)) {
                var pumpClone = {
                    enabled: sourceData.enabled,
                    sprinkleName: sourceData.sprinkleName && !isAutoVentilSprinkleName(sourceData.sprinkleName)
                        ? sourceData.sprinkleName
                        : defaultPumpSprinkleName(ventilNr),
                    name: ''
                };
                writeRowDataToDom(newRow, table, pumpClone);
                reapplyRowDataToDom(newRow, table, pumpClone);
            } else {
                writeRowDataToDom(newRow, table, {
                    enabled: sourceData.enabled,
                    sprinkleName: sourceData.sprinkleName || defaultVentilSprinkleName(ventilNr),
                    name: defaultVentilObjectId(ventilNr)
                });
                reapplyRowDataToDom(newRow, table, {
                    enabled: sourceData.enabled,
                    sprinkleName: sourceData.sprinkleName || defaultVentilSprinkleName(ventilNr),
                    name: defaultVentilObjectId(ventilNr)
                });
            }
            markClonedNameHighlight(newRow, table);
            markFocusedRow(table, newRow);
            paintVentilNr(table);
            dedupeSprinkleNames(table);
            var rows = reorderActions(table);
            placeAddInLastRow(table, rows);
            if (isTab2VentilTable(table)) {
                var slot = schaltzeitSlotForRowIndex(getVentilDataRows(table).indexOf(newRow));
                ensureSchaltzeitStatesForNr(slot, function (ensureErr) {
                    if (ensureErr) {
                        try {
                            console.warn('ensureSchaltzeit:', ensureErr);
                        } catch (eLog) {}
                        try {
                            (getTopWin(parentDoc()) || window).alert(
                                'Schaltzeit-DPs konnten nicht angelegt werden:\n' + (ensureErr.message || ensureErr)
                            );
                        } catch (eAlert) {}
                        return;
                    }
                    syncSchaltzeitDefaultToDp(slot, sourceData.enabled, sourceData.zeit, function (syncErr) {
                        if (syncErr) {
                            try {
                                console.warn('syncSchaltzeitDefaultToDp:', syncErr);
                            } catch (eSync) {}
                        }
                    });
                });
                return;
            }
            if (isPumpTable(table)) {
                applyPumpRows(table);
                return;
            }
            ensureVentilStatesForNr(ventilNr, function (ensureErr) {
                if (ensureErr) {
                    try {
                        console.warn('ensureVentil:', ensureErr);
                    } catch (eLog) {}
                    return;
                }
                syncVentilDefaultToDp(ventilNr, sourceData.enabled, function (syncErr) {
                    if (syncErr) {
                        try {
                            console.warn('syncVentilDefaultToDp:', syncErr);
                        } catch (eSync) {}
                    }
                    reapplyRowDataToDom(newRow, table, {
                        enabled: sourceData.enabled,
                        sprinkleName: sourceData.sprinkleName || defaultVentilSprinkleName(ventilNr),
                        name: defaultVentilObjectId(ventilNr)
                    }, [150, 450]);
                });
            });
        });
    }

    function parseVentilNrFromObjectId(oid) {
        var s = String(oid || '').trim();
        if (!s) {
            return 0;
        }
        var m = s.match(/(?:^|\.)Ventil(\d+)$/i);
        if (m) {
            return parseInt(m[1], 10);
        }
        m = s.match(/(?:^|\.)Ventil(\d+)(?:\.|$)/i);
        if (m) {
            return parseInt(m[1], 10);
        }
        m = s.match(/^(\d+)$/);
        if (m) {
            var n = parseInt(m[1], 10);
            if (n >= 1) {
                return n;
            }
        }
        return 0;
    }

    function canonicalVentilObjectId(nr) {

    function collectUsedVentilNumbers(table, excludeRow) {
        var used = {};
        getVentilDataRows(table).forEach(function (row, idx) {
            if (excludeRow && row === excludeRow) {
                return;
            }
            used[idx + 1] = true;
        });
        return used;
    }

    function maxVentilNrInTable(table, excludeRow) {
        var used = collectUsedVentilNumbers(table, excludeRow);
        var max = 0;
        Object.keys(used).forEach(function (key) {
            var n = parseInt(key, 10);
            if (n > max) {
                max = n;
            }
        });
        return max;
    }

    function resolveNextVentilNr(table, excludeRow, done) {
        if (typeof excludeRow === 'function') {
            done = excludeRow;
            excludeRow = null;
        }
        var max = maxVentilNrInTable(table, excludeRow);
        if (max < 1) {
            var existingRows = getVentilDataRows(table).filter(function (row) {
                return row !== excludeRow;
            });
            max = existingRows.length;
        }
        var next = Math.max(1, max + 1);
        if (done) {
            done(null, next);
        }
    }

    function collectVentilNumbersFromTable(table) {
        var numbers = [];
        getVentilDataRows(table).forEach(function (row, idx) {
            var nr = idx + 1;
            if (table && table._bwSkipEnsureVentilNrs && table._bwSkipEnsureVentilNrs[nr]) {
                return;
            }
            numbers.push(nr);
        });
        numbers.sort(function (a, b) {
            return a - b;
        });
        return numbers;
    }

    function ensureTableVentilDps(table, done) {
        if (!table) {
            if (done) {
                done();
            }
            return;
        }
        var numbers = collectVentilNumbersFromTable(table);
        if (!numbers.length) {
            if (done) {
                done();
            }
            return;
        }
        var idx = 0;
        function next() {
            if (idx >= numbers.length) {
                if (done) {
                    done(null, numbers);
                }
                return;
            }
            var nr = numbers[idx];
            idx += 1;
            ensureVentilStatesForNr(nr, function (err) {
                if (err) {
                    try {
                        console.warn('ensureTableVentilDps Ventil' + nr + ':', err);
                    } catch (eLog) {}
                }
                next();
            });
        }
        next();
    }

        var nr = 0;
        var oidCell = getObjectIdCell(row, table);

        if (nr < 1) {
            row.querySelectorAll('input, textarea, .MuiInputBase-input').forEach(function (inp) {
                if (nr > 0) {
                    return;
                }
                if (!inp || inp.type === 'checkbox' || inp.type === 'radio') {
                    return;
                }
                nr = parseVentilNrFromObjectId(String(inp.value || '').trim());
            });
        }
        if (nr < 1) {
            nr = getVentilNrForRow(row, table);
        }
        if (nr > 0) {
            row.setAttribute('data-bw-delete-ventil-nr', String(nr));

    function adapterSendTo(socket, command, payload) {
        return new Promise(function (resolve, reject) {
            if (!socket) {
                reject(new Error('Keine Socket-Verbindung'));
                return;
            }
            function finish(result) {
                if (result && result.error) {
                    reject(new Error(String(result.error)));
                    return;
                }
                resolve(result || {});
            }
            if (typeof socket.sendTo === 'function') {
                try {
                    var p = socket.sendTo(BW_ADAPTER_NS, command, payload);
                    if (p && typeof p.then === 'function') {
                        p.then(finish).catch(reject);
                        return;
                    }
                } catch (eSend) {
                    reject(eSend);
                    return;
                }
            }
            if (typeof socket.emit === 'function') {
                socket.emit('sendTo', BW_ADAPTER_NS, command, payload, function (res) {
                    finish(res);
                });
                return;
            }
            reject(new Error('sendTo nicht verfügbar'));
        });
    }

    function objectExistsViaAdmin(socket, objectId) {
        return new Promise(function (resolve) {
            if (!socket || !objectId) {
                resolve(false);
                return;
            }
            if (typeof socket.getObject === 'function') {
                socket.getObject(objectId).then(function (obj) {
                    resolve(!!(obj && (obj._id || obj.type)));
                }).catch(function () {
                    resolve(false);
                });
                return;
            }
            if (typeof socket.emit === 'function') {
                socket.emit('getObject', objectId, function (err, obj) {
                    resolve(!err && !!(obj && (obj._id || obj.type)));
                });
                return;
            }
            resolve(false);
        });
    }

    function ensureVentilStatesForNr(nr, done) {
        getAdminSocketAsync(parentDoc(), function (err, socket) {
            if (err || !socket || typeof socket.sendTo !== 'function') {
                if (done) {
                    done(err || new Error('sendTo nicht verfügbar'));
                }
                return;
            }
            socket.sendTo(BW_ADAPTER_NS, 'ensureVentil', { nr: nr }).then(function (res) {
                if (done) {
                    done(null, res);
                }
            }).catch(function (sendErr) {
                if (done) {
                    done(sendErr);
                }
            });
        });
    }

    function collectSchaltzeitDeleteFullIds(socket, slot) {
        var n = parseInt(slot, 10);
        if (!Number.isFinite(n) || n < 1) {
            return Promise.reject(new Error('Ungültige Schaltzeit-Nr'));
        }
        var top = schaltzeitSlotChannelId(n);
        var rangeEnd = top + '.\uffff';
        var fixed = [];
        ['Zeit', 'Aktiv', 'Astro', 'AstroTyp', 'AstroOffset', 'WeFeiertag', 'Anzeige'].concat(BW_ZS_TAG_SUFFIX).forEach(function (field) {
            fixed.push(top + '.' + field);
        });
        if (fixed.indexOf(top) < 0) {
            fixed.push(top);
        }
        if (!socket) {
            return Promise.resolve(fixed.sort(function (a, b) {
                return b.split('.').length - a.split('.').length;
            }));
        }
        var scans = [];
        if (typeof socket.getObjectViewSystem === 'function') {
            scans.push(socket.getObjectViewSystem('state', top, rangeEnd));
            scans.push(socket.getObjectViewSystem('channel', top, rangeEnd));
        }
        if (!scans.length) {
            return Promise.resolve(fixed.sort(function (a, b) {
                return b.split('.').length - a.split('.').length;
            }));
        }
        return Promise.all(scans).then(function (results) {
            var ids = fixed.slice();
            var ri;
            for (ri = 0; ri < results.length; ri += 1) {
                extractObjectViewIds(results[ri]).forEach(function (id) {
                    if (id.indexOf(top) === 0) {
                        ids.push(id);
                    }
                });
            }
            var seen = {};
            var unique = [];
            ids.forEach(function (id) {
                if (!id || seen[id]) {
                    return;
                }
                seen[id] = true;
                unique.push(id);
            });
            unique.sort(function (a, b) {

    function isSchaltzeitSlotMarkedDeleted(slot) {
        var n = parseInt(slot, 10);

        if (!doc) {
            return false;
        }
        var tables = findAllAdminTables(doc);

        for (ti = 0; ti < tables.length; ti += 1) {

            if (!isTab2VentilTable(table) || !table._bwSkipEnsureSchaltzeitSlots) {
                continue;
            }
            if (table._bwSkipEnsureSchaltzeitSlots[n]) {
                return true;
