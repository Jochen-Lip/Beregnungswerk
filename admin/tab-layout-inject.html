    var TIP_LAYER_ID = 'bw-tip-layer';
    var tipAnchor = null;

    function clearTooltip(el) {
        if (!el) {
            return;
        }
        el.removeAttribute('title');
        el.removeAttribute('data-bw-tooltip');
        el.removeAttribute('data-bw-tip-place');
        el.removeAttribute('aria-label');
    }

    function setTooltip(el, text, place) {
        if (!el || !text) {
            return;
        }
        el.removeAttribute('title');
        el.setAttribute('data-bw-tooltip', text);
        if (place) {
            el.setAttribute('data-bw-tip-place', place);
        } else {
            el.removeAttribute('data-bw-tip-place');
        }
    }

    function setTooltipOnWrap(wrap, text, place) {
        if (!wrap || !text) {
            return;
        }
        setTooltip(wrap, text, place || 'top');
        wrap.querySelectorAll('.MuiIconButton-root, button, .bw-action-btn, .MuiButton-root').forEach(clearTooltip);
    }

    function ensureTipLayer(doc) {
        var layer = doc.getElementById(TIP_LAYER_ID);
        if (!layer) {
            layer = doc.createElement('div');
            layer.id = TIP_LAYER_ID;
            doc.body.appendChild(layer);
        }
        return layer;
    }

    function hideTipLayer(doc) {
        var layer = doc.getElementById(TIP_LAYER_ID);
        if (layer) {
            layer.style.setProperty('display', 'none', 'important');
        }
        tipAnchor = null;
    }

    function showTipLayer(doc, anchor, text) {
        var layer = ensureTipLayer(doc);
        var win = parentWin(doc);
        var place = anchor.getAttribute('data-bw-tip-place') || 'top';
        layer.textContent = text;
        layer.setAttribute('data-place', place);
        layer.style.setProperty('display', 'block', 'important');
        layer.style.setProperty('visibility', 'hidden', 'important');
        var rect = anchor.getBoundingClientRect();
        var layerRect = layer.getBoundingClientRect();
        var top;
        var left;
        if (place === 'bottom') {
            top = rect.bottom + 8;
            left = rect.left;
        } else {
            top = rect.top - layerRect.height - 8;
            left = rect.left + (rect.width / 2) - (layerRect.width / 2);
        }
        var vw = win.innerWidth || doc.documentElement.clientWidth;
        var vh = win.innerHeight || doc.documentElement.clientHeight;
        left = Math.max(8, Math.min(left, vw - layerRect.width - 8));
        top = Math.max(8, Math.min(top, vh - layerRect.height - 8));
        layer.style.setProperty('left', Math.round(left) + 'px', 'important');
        layer.style.setProperty('top', Math.round(top) + 'px', 'important');
        layer.style.setProperty('visibility', 'visible', 'important');
        tipAnchor = anchor;
    }

    function findTipTarget(node) {
        while (node && node.nodeType === 1) {
            if (node.getAttribute && node.getAttribute('data-bw-tooltip')) {
                return node;
            }
            node = node.parentElement;
        }
        return null;
    }

    function ensureTooltipDelegation(doc) {
        if (!doc || !doc.body || doc.body.getAttribute('data-bw-tip-delegated') === '1') {
            return;
        }
        doc.body.setAttribute('data-bw-tip-delegated', '1');
        doc.body.addEventListener('mousemove', function (e) {
            var target = findTipTarget(e.target);
            if (!target) {
                hideTipLayer(doc);
                return;
            }
            var text = target.getAttribute('data-bw-tooltip');
            if (!text) {
                hideTipLayer(doc);
                return;
            }
            if (target !== tipAnchor) {
                showTipLayer(doc, target, text);
            }
        }, true);
        doc.body.addEventListener('mouseleave', function () {
            hideTipLayer(doc);
        }, true);
        var win = parentWin(doc);
        if (win) {
            win.addEventListener('scroll', function () {
                hideTipLayer(doc);
            }, true);
            win.addEventListener('resize', function () {
                hideTipLayer(doc);
            });
        }
    }

    function hideMuiTooltipPoppers(doc) {
        if (!doc) {
            return;
        }
        doc.querySelectorAll('.MuiTooltip-popper, .MuiTooltip-tooltip').forEach(function (pop) {
            pop.style.setProperty('display', 'none', 'important');
            pop.style.setProperty('visibility', 'hidden', 'important');
            pop.style.setProperty('opacity', '0', 'important');
            pop.style.setProperty('pointer-events', 'none', 'important');
        });
    }

    function applyVentilTableTooltips(table, doc) {
        hideMuiTooltipPoppers(doc);
        if (!table) {
            return;
        }
        tagAdminTable(table);
        var roleTips = roleTipsForTable(table);
        var fieldTips = fieldTipsForTable(table);
        var headerTips = headerTipsForTable(table);
        var tab2 = isTab2VentilTable(table);

        table.querySelectorAll('[data-bw-role][data-bw-show="1"]').forEach(function (wrap) {
            var role = wrap.getAttribute('data-bw-role');
            var row = wrap.closest('.MuiTableRow-root, tr');
            var tip = role === 'del' && row && isOnlyDataRowLeft(row, table)
                ? roleTips.delFirst
                : roleTips[role];
            if (tip) {
                setTooltipOnWrap(wrap, tip);
            }
        });

        table.querySelectorAll('[data-bw-edit-btn="1"][data-bw-show="1"]').forEach(function (wrap) {
            if (roleTips.edit) {
                setTooltipOnWrap(wrap, roleTips.edit, 'top');
            }
        });

        table.querySelectorAll('[data-bw-active-toggle="1"]').forEach(function (btn) {
            var on = btn.getAttribute('data-bw-active') === '1';
            if (btn.getAttribute('data-bw-toggle-kind') === 'astro-ein') {
                setTooltip(btn, on ? fieldTips.astroEinOn : fieldTips.astroEinOff);
                return;
            }
            setTooltip(btn, on ? fieldTips.activeOn : fieldTips.activeOff);
        });

        table.querySelectorAll('[data-bw-clear-eraser="1"]').forEach(function (btn) {
            setTooltip(btn, fieldTips.clear);
        });

        if (!tab2) {
            table.querySelectorAll('[data-bw-dots-wrap="1"]').forEach(function (wrap) {
                setTooltipOnWrap(wrap, fieldTips.dots);
            });
        }

        var seenClockAktivTip = false;
        table.querySelectorAll('.MuiTableHead-root .MuiTableCell-root, .MuiTableHead-root th').forEach(function (cell) {
            var label = (cell.textContent || '').replace(/\s+/g, ' ').trim();
            var tip = headerTips[label];
            if (tab2 && (label === 'Aktiv' || label === 'Active')) {
                if (seenClockAktivTip) {
                    tip = headerTips['Ein'] || headerTips['On'] || tip;
                }
                seenClockAktivTip = true;
            }
            if (tip) {
                setTooltip(cell, tip, 'bottom');
            }
        });

        if (tab2) {
            applyTab2ZeitColumnTooltips(table, fieldTips);
            getVentilDataRows(table).forEach(function (row) {
                if (isAddRow(row)) {
                    return;
                }
                var wochentagCell = getWochentagCell(row, table);
                if (wochentagCell) {
                    var picker = wochentagCell.querySelector('[data-bw-wochentag-picker="1"]');
                    if (picker) {
                        setTooltip(picker, fieldTips.wochentag, 'bottom');
                        picker.querySelectorAll('[data-bw-wochentag-btn="1"]').forEach(function (dayBtn) {
                            var tip = dayBtn.getAttribute('data-bw-wochentag') === 'WeFeiertag'
                                ? fieldTips.wochentagFt
                                : fieldTips.wochentag;
                            setTooltip(dayBtn, tip, 'top');
                        });
                    } else {
                        var wtInput = wochentagCell.querySelector('input, textarea, .MuiInputBase-input');
                        if (wtInput) {
                            setTooltip(wtInput, fieldTips.wochentag, 'bottom');
                        }
                    }
                }
                var astroCellTip = getAstroCell(row, table);
                if (astroCellTip) {
                    var astroPanel = astroCellTip.querySelector('[data-bw-astro-panel="1"]');
                    if (astroPanel) {
                        var astroSummary = astroPanel.querySelector('[data-bw-astro-summary="1"]');
                        var astroSettingsBtn = astroPanel.querySelector('[data-bw-astro-settings-btn="1"]');
                        if (astroSummary) {
                            setTooltip(astroSummary, fieldTips.astroTyp, 'bottom');
                        }
                        if (astroSettingsBtn) {
                            setTooltip(astroSettingsBtn, fieldTips.astroSettings, 'top');
                        }
                    }
                }
            });
            return;
        }

        table.querySelectorAll('.MuiTableBody-root .MuiTableRow-root, .MuiTableBody-root tr').forEach(function (row) {
            if (isAddRow(row) || row.classList.contains('bw-hide-bottom-add')) {
                return;
            }
            row.querySelectorAll(':scope > .MuiTableCell-root, :scope > td').forEach(function (cell) {
                if (cell.querySelector('[data-bw-active-cell="1"]')) {
                    return;
                }
                var input = cell.querySelector('input:not([type="checkbox"]):not([type="hidden"]), textarea, .MuiInputBase-input');
                if (!input) {
                    return;
                }
                if (cell.querySelector('[data-bw-dots-wrap="1"]') || cell.querySelector('[data-bw-dots-inner="1"]')) {
                    setTooltip(input, fieldTips.objectId, 'bottom');
                    return;
                }
                if (cell.querySelector('[data-bw-clear-eraser="1"]')) {
                    setTooltip(input, fieldTips.name, 'bottom');
                }
            });
        });
    }

    function parentDoc() {
        var w = window;
        var fallback = null;
        for (var i = 0; i < 12 && w; i += 1) {
            try {
                var d = w.parent && w.parent.document;
                if (d && d.body) {
                    if (d.querySelector('.m.adapter-beregnungswerk, .adapter-beregnungswerk, .adapter-container, .MuiTable-root')) {
                        return d;
                    }
                    if (!fallback) {
                        fallback = d;
                    }
                }
            } catch (e) {}
            if (!w.parent || w.parent === w) {
                break;
            }
            w = w.parent;
        }
        try {
            if (window.top && window.top.document && window.top.document.body) {
                return window.top.document;
            }
        } catch (e2) {}
        return fallback;
    }

    /** Adapter-Config-Dokument (Tabs/Toolbar), auch in verschachtelten iframes. */
    function getBeregnungswerkConfigDoc(fallbackDoc) {
        var seen = {};
        function searchDoc(d) {
            if (!d || seen[d]) {
                return null;
            }
            seen[d] = true;
            if (d.querySelector) {
                if (d.querySelector('.m.adapter-beregnungswerk, .adapter-beregnungswerk')) {
                    return d;
                }
                if (d.querySelector('.MuiTabs-root[style*="gras-hintergrund"]')) {
                    return d;
                }
            }

    function actionAriaMatches(role, aria) {
        var label = String(aria || '').toLowerCase();
        if (!role || !label) {
            return false;
        }
        if (role === 'up') {
            return label.indexOf('nach oben') >= 0 || label.indexOf('move up') >= 0 || label.indexOf('arrow up') >= 0;
        }
        if (role === 'down') {
            return label.indexOf('nach unten') >= 0 || label.indexOf('move down') >= 0 || label.indexOf('arrow down') >= 0;
        }
        if (role === 'del') {
            return label.indexOf('zeile löschen') >= 0 || label.indexOf('zeile loeschen') >= 0 ||
                label.indexOf('delete row') >= 0 || label.indexOf('remove row') >= 0;
        }
        if (role === 'clone') {
            return label.indexOf('klonen') >= 0 || label.indexOf('clone') >= 0 || label.indexOf('duplicate') >= 0;
        }
        if (role === 'add') {
            return label.indexOf('hinzufügen') >= 0 || label.indexOf('hinzufuegen') >= 0 || label.indexOf('add row') >= 0;
        }
        return false;
    }

    function findActionButtonByAria(root, role) {
        if (!root || !role || !root.querySelectorAll) {
            return null;
        }
        var buttons = root.querySelectorAll('.MuiIconButton-root, button');
        var i;
        for (i = 0; i < buttons.length; i += 1) {
            var btn = buttons[i];
            if (btn.closest('[data-bw-role], [data-bw-custom-add], [data-bw-custom-clone], [data-bw-edit-btn]')) {
                continue;
            }
            if (role === 'del' && btn.querySelector('.iob-ani-trash')) {
                return btn;
            }
            if (actionAriaMatches(role, btn.getAttribute('aria-label'))) {
                return btn;
            }
        }
        return null;
    }

    function findIcon(root, ids) {
        if (!root || !ids || !ids.length || !root.querySelector) {
            return null;
        }
        var i;
        for (i = 0; i < ids.length; i += 1) {
            var icon = root.querySelector('svg[data-testid="' + ids[i] + '"]');
            if (icon) {
                return icon.closest('.MuiIconButton-root, button');
            }
        }
        return findActionButtonByAria(root, roleForIconIds(ids));
    }

    function wrapNode(btn) {
        return btn ? (btn.closest('.MuiTooltip-root') || btn) : null;
    }

    function wrapFor(cell, ids) {
        return wrapNode(findIcon(cell, ids));
    }

    function tagWrap(wrap, role, col, show) {
        if (!wrap) {
            return;
        }
        wrap.removeAttribute('data-bw-disabled');
        wrap.setAttribute('data-bw-role', role);
        wrap.setAttribute('data-bw-show', show ? '1' : '0');
        wrap.style.removeProperty('order');
        wrap.style.removeProperty('flex');
        wrap.style.removeProperty('pointer-events');
        wrap.style.removeProperty('cursor');
        wrap.style.removeProperty('opacity');
        if (show) {
            wrap.setAttribute('data-bw-col', String(col));
            wrap.style.setProperty('grid-column', String(col), 'important');
            wrap.style.setProperty('grid-row', '1', 'important');
            wrap.style.setProperty('display', 'inline-flex', 'important');
            wrap.style.setProperty('justify-self', 'center', 'important');
            wrap.style.setProperty('align-self', 'center', 'important');
            wrap.style.setProperty('width', BTN_SIZE + 'px', 'important');
            wrap.style.setProperty('height', BTN_SIZE + 'px', 'important');
            wrap.style.removeProperty('position');
            wrap.style.removeProperty('left');
            styleActionSlot(wrap);
        } else {
            wrap.removeAttribute('data-bw-col');
            wrap.style.setProperty('display', 'none', 'important');
            wrap.style.removeProperty('grid-column');
            wrap.style.removeProperty('grid-row');
        }
    }

    function grayActionIcon(wrap) {
        if (!wrap) {
            return;
        }
        var role = wrap.getAttribute('data-bw-role');
        if (role) {
            applyActionRoleIcon(wrap, role, true);
            return;
        }
        wrap.querySelectorAll('svg path').forEach(function (path) {
            path.setAttribute('fill', '#cfcfcf');
            path.style.setProperty('fill', '#cfcfcf', 'important');
            path.style.setProperty('stroke', '#cfcfcf', 'important');
            path.style.setProperty('stroke-width', '0.8px', 'important');
        });
        wrap.querySelectorAll('img.bw-action-icon, img.bw-edit-icon').forEach(function (img) {
            img.style.setProperty('opacity', '0.38', 'important');
        });
    }

    function tagWrapDisabled(wrap, role, col) {
        if (!wrap) {
            return;
        }
        tagWrap(wrap, role, col, true);
        wrap.setAttribute('data-bw-disabled', '1');
        wrap.style.setProperty('pointer-events', 'none', 'important');
        wrap.style.setProperty('cursor', 'default', 'important');
        wrap.style.setProperty('background', '#f5f5f5', 'important');
        wrap.style.setProperty('background-color', '#f5f5f5', 'important');
        wrap.style.setProperty('border', '1px solid #e5e5e5', 'important');
        wrap.style.setProperty('box-shadow', 'none', 'important');
        var btn = wrap.querySelector('.MuiIconButton-root, button, .bw-action-btn');
        if (btn) {
            btn.setAttribute('disabled', 'disabled');
            btn.setAttribute('aria-disabled', 'true');
            btn.style.setProperty('pointer-events', 'none', 'important');
            btn.style.setProperty('cursor', 'default', 'important');
        }
        grayActionIcon(wrap);
    }


    function ensureAddSpacer(cell) {
        if (!cell) {
            return;
        }
        var sp = cell.querySelector('[data-bw-spacer="add"]');
        if (!sp) {
            sp = cell.ownerDocument.createElement('span');
            sp.setAttribute('data-bw-spacer', 'add');
            cell.appendChild(sp);
        }
        sp.setAttribute('data-bw-col', String(ADD_SPACER_COL));
        sp.style.setProperty('grid-column', String(ADD_SPACER_COL), 'important');
        sp.style.setProperty('grid-row', '1', 'important');
        sp.style.setProperty('display', 'inline-flex', 'important');
        sp.style.setProperty('width', BTN_SIZE + 'px', 'important');
        sp.style.setProperty('height', BTN_SIZE + 'px', 'important');
        sp.style.setProperty('visibility', 'hidden', 'important');
        sp.style.setProperty('pointer-events', 'none', 'important');
        sp.style.setProperty('margin', '0', 'important');
        sp.style.setProperty('padding', '0', 'important');
    }

    function clearAddSpacer(cell) {
        if (!cell) {
            return;
        }
        var sp = cell.querySelector('[data-bw-spacer="add"]');
        if (sp) {
            sp.remove();
        }
    }


    function isAddRow(row) {
        if (!row || !findIcon(row, ADD_IDS)) {
            return false;
        }
        if (row.querySelector('input, textarea, .MuiCheckbox-root, .MuiSwitch-root')) {
            return false;
        }
        if (row.querySelector(':scope > .MuiTableCell-root[colspan], :scope > td[colspan]')) {
            return true;
        }
        var tbody = row.parentElement;
        if (!tbody) {
            return false;
        }
        var rows = tbody.querySelectorAll(':scope > .MuiTableRow-root, :scope > tr');
        return rows.length > 1 && row === rows[rows.length - 1];
    }

    function isDataRow(row) {
        if (!row || isAddRow(row)) {
            return false;
        }
        if (row.getAttribute('data-bw-inline-panel') === '1') {
            return false;
        }
        if (row.querySelector('.MuiCheckbox-root, input[type="checkbox"], [data-bw-active-toggle="1"]')) {
            return true;
        }
        var inputs = row.querySelectorAll('input[type="text"], .MuiInputBase-input');
        return inputs.length >= 2;
    }

    function isKnownActionTestId(testId) {
        if (!testId) {
            return false;
        }
        var all = UP_IDS.concat(DOWN_IDS, CLONE_IDS, DEL_IDS, ADD_IDS);
        return all.indexOf(testId) >= 0;
    }

    function roleForIconIds(ids) {
        if (ids === DEL_IDS) {
            return 'del';
        }
        if (ids === CLONE_IDS) {
            return 'clone';
        }
        if (ids === UP_IDS) {
            return 'up';
        }
        if (ids === DOWN_IDS) {
            return 'down';
        }
        if (ids === ADD_IDS) {
            return 'add';
        }
        return '';
    }

    function wrapForRow(row, ids) {
        var role = roleForIconIds(ids);
        if (role) {
            var cell = getActionCell(row);
            if (cell) {
                var existing = cell.querySelector('[data-bw-role="' + role + '"]');
                if (existing) {
                    return existing;
                }
            }
        }
        return wrapNode(findIcon(row, ids));
    }

    function moveWrapToActionCell(cell, wrap) {
        if (!cell || !wrap) {
            return wrap;
        }
        if (wrap.parentElement !== cell) {
            cell.appendChild(wrap);
        }
        return wrap;
    }

    function cleanupSteuerungCell(row, actionCell) {
        var first = row.querySelector(':scope > .MuiTableCell-root:first-child, :scope > td:first-child');
        if (!first || first === actionCell) {
            return;
        }
        first.querySelectorAll('.MuiIconButton-root, button').forEach(function (btn) {
            var svg = btn.querySelector('svg[data-testid]');
            if (!svg || !isKnownActionTestId(svg.getAttribute('data-testid'))) {
                return;
            }
            var wrap = wrapNode(btn);
            if (wrap && !actionCell.contains(wrap)) {
                wrap.setAttribute('data-bw-show', '0');
                wrap.style.setProperty('display', 'none', 'important');
            }
        });
    }

    function findVentilTable(doc) {
        var tables = findAllAdminTables(doc);
        var i;

                    fail(adminErrMsg(err) || 'Socket-Verbindung fehlgeschlagen');
                });
                raw.on('connect', function () {
                    raw.emit('authenticate', function (ok) {
                        if (!ok) {
                            fail('Socket-Authentifizierung fehlgeschlagen');
                            return;
                        }
                        if (connectTimer) {
                            window.clearTimeout(connectTimer);
                            connectTimer = null;
                        }
                        resolve(wrapRawSocket(raw));
                    });
                });
                connectTimer = window.setTimeout(function () {
                    fail('Socket-Verbindung Zeitüberschreitung');
                }, 20000);
            }, failPromise);
        });
        return bwOwnSocketPromise;
    }

    function getAdminSocketAsync(doc, done) {

        if (sync && (typeof sync.sendTo === 'function' || typeof sync.getState === 'function' ||
            typeof sync.setState === 'function' || typeof sync.emit === 'function')) {

        ensureOwnAdminSocket().then(function (own) {

            if (sync) {

            done(adminErrMsg(err) || String(err), null);
        });

    function adminDelObject(socket, objectId, options) {
        if (!socket || !objectId) {
            return Promise.reject(new Error('delObject: fehlende Parameter'));
        }
        var opts = options || { children: true };
        if (typeof socket.delObject === 'function') {
            try {
                var direct = socket.delObject(objectId, opts);
                if (direct && typeof direct.then === 'function') {
                    return direct;
                }
                if (direct !== undefined) {
                    return Promise.resolve(direct);
                }
            } catch (eDirect) {
                // emit-Fallback unten
            }
        }
        if (typeof socket.emit === 'function') {
            return new Promise(function (resolve, reject) {
                socket.emit('delObject', objectId, opts, function (err) {
                    if (err) {
                        reject(new Error(String(err)));
                        return;
                    }
                    resolve();
                });
            });
        }
        return Promise.reject(new Error('delObject nicht verfügbar'));
    }


    function extractObjectViewIds(result) {
        var ids = [];
        if (!result) {
            return ids;
        }
        if (Array.isArray(result.rows)) {
            result.rows.forEach(function (row) {
                if (row && row.id) {
                    ids.push(row.id);
                }
            });
            return ids;
        }
        if (typeof result === 'object') {
            Object.keys(result).forEach(function (key) {
                if (key && key.indexOf('.') >= 0) {
                    ids.push(key);
                }
            });
        }
        return ids;
    }

    function queryObjectIds(socket, search, callback) {
        if (!socket) {
            callback([]);
            return;
        }
        var q = String(search || '').trim();
        var start = q || '0_userdata.0.';
        var end = q ? q + '\uFFFF' : 'z\uFFFF';

        function finish(result) {
            callback(extractObjectViewIds(result).slice(0, 120));
        }

        function emitFallback() {
            if (typeof socket.emit !== 'function') {
                callback([]);
                return;
            }
            socket.emit('getObjectView', 'system', 'state', { startkey: start, endkey: end }, function (a, b) {
                var result = b !== undefined && b !== null ? b : a;
                finish(result);
            });
        }

        try {
            if (typeof socket.getObjectViewSystem === 'function') {
                var p1 = socket.getObjectViewSystem('state', start, end);
                if (p1 && typeof p1.then === 'function') {
                    p1.then(finish).catch(emitFallback);
                    return;
                }
            }
            if (typeof socket.getObjectView === 'function') {
                var p2 = socket.getObjectView(start, end, 'state');
                if (p2 && typeof p2.then === 'function') {
                    p2.then(finish).catch(emitFallback);
                    return;
                }
            }
        } catch (e) {
            emitFallback();
            return;
        }
        emitFallback();
    }

    function setStateViaAdmin(socket, stateId, val, done) {
        if (!socket) {
            done('Keine Admin-Verbindung');
            return;
        }
        var finished = false;
        var watchdog = window.setTimeout(function () {
            if (finished) {
                return;
            }
            finished = true;
            done('timeout');
        }, 15000);
        function finish(err) {
            if (finished) {
                return;
            }
            finished = true;
            window.clearTimeout(watchdog);
            done(err || null);
        }
        if (typeof socket.setState === 'function') {
            try {
                var p = socket.setState(stateId, val, false);
                if (p && typeof p.then === 'function') {
                    p.then(function () {
                        finish(null);
                    }).catch(function (err) {
                        finish(adminErrMsg(err) || 'setState fehlgeschlagen');
                    });
                    return;
                }
                finish(null);
                return;
            } catch (e) {
                finish(adminErrMsg(e) || 'setState fehlgeschlagen');
                return;
            }
        }
        if (typeof socket.emit === 'function') {
            socket.emit('setState', stateId, val, false, function (err) {
                finish(err ? adminErrMsg(err) : null);
            });
            return;
        }
        finish('setState nicht verfügbar');
    }


    function getObjectViaAdmin(socket, objectId, done) {
        if (typeof socket.getObject === 'function') {
            try {
                var p = socket.getObject(objectId);
                if (p && typeof p.then === 'function') {
                    p.then(function (obj) {
                        done(null, obj);
                    }).catch(function (err) {
                        done(adminErrMsg(err) || 'getObject fehlgeschlagen', null);
                    });
                    return;

            } catch (e) {
                done(adminErrMsg(e) || 'getObject fehlgeschlagen', null);
                return;
            }
        }
        if (typeof socket.emit === 'function') {
            socket.emit('getObject', objectId, function (err, obj) {
                if (typeof err === 'object' && err && err._id && obj === undefined) {
                    done(null, err);
                    return;
                }
                done(err ? adminErrMsg(err) : null, obj);
            });
            return;
        }
        done('getObject nicht verfügbar', null);
    }

    function beginNativeOidPickCapture(docs, session) {
        if (session.captureStarted) {
            return;
        }
        session.captureStarted = true;
        session.removeFns = [];

        function rememberTreeId(raw) {
            var treeId = parsePickedIdFromDialogText(raw);
            if (treeId && treeId !== session.originalName) {
                session.lastTreeId = treeId;
            }
        }

        function scheduleApply() {
            [0, 40, 120, 300, 600].forEach(function (delay) {
                window.setTimeout(function () {
                    if (!session.closed && !session.applied) {
                        var dlg = findNativeSelectIdDialog(docs);
                        var picked = readPickedIdFromSelectIdDialog(dlg, session.lastTreeId);
                        if (!picked && session.okPressed) {
                            picked = session.lastTreeId;
                        }
                        session.tryApply(picked);
                    }
                }, delay);
            });
        }

        function onDocEvent(e) {
            if (session.closed || session.applied) {
                return;
            }
            var target = e.target;
            if (!target || !target.closest) {
                return;
            }
            var cancelBtn = target.closest('[id^="ar_dialog_selectid_cancel"]');
            if (cancelBtn && e.type === 'click') {
                session.end(false);
                return;
            }
            var treeTitle = target.closest('.fancytree-title');
            if (treeTitle) {
                var treeDlg = treeTitle.closest('.MuiDialog-root');
                if (treeDlg && treeDlg.querySelector('#ar_dialog_selectid_title')) {
                    rememberTreeId(treeTitle.textContent);
                    if (e.type === 'dblclick') {
                        session.okPressed = true;
                        scheduleApply();
                    }
                }
            }
            var okBtn = target.closest('[id^="ar_dialog_selectid_ok"]');
            if (okBtn && !okBtn.disabled) {
                var okDlg = okBtn.closest('.MuiDialog-root');
                var prePick = readPickedIdFromSelectIdDialog(okDlg, session.lastTreeId);
                if (prePick) {
                    session.lastTreeId = prePick;
                }
                if (e.type === 'mousedown' || e.type === 'click') {
                    session.okPressed = true;
                }
                if (e.type === 'click') {
                    scheduleApply();
                }
            }
        }

        docs.forEach(function (doc) {
            ['mousedown', 'click', 'dblclick'].forEach(function (type) {
                doc.addEventListener(type, onDocEvent, true);
                session.removeFns.push(function () {
                    doc.removeEventListener(type, onDocEvent, true);
                });
            });
        });
    }

    function dispatchNativeClick(el) {

                el.focus({ preventScroll: true });
            }
        } catch (eFocus) {}
        ['pointerdown', 'mousedown', 'mouseup', 'click'].forEach(function (type) {
            try {
                el.dispatchEvent(new MouseEvent(type, {
                    bubbles: true,
                    cancelable: true,
                    view: view,
                    buttons: 1
                }));
            } catch (eEvt) {}
        });
        try {
            el.click();
        } catch (eClick) {}
    }

    function collectPickerDocuments(hostDoc) {
        var docs = [];
        function add(doc) {
            if (doc && docs.indexOf(doc) < 0) {
                docs.push(doc);
            }
        }
        add(hostDoc);
        add(parentDoc());
        add(resolvePickerDocument(hostDoc));
        try {
            var top = getTopWin(hostDoc && hostDoc.defaultView ? hostDoc.defaultView : window);
            if (top && top.document) {
                add(top.document);
            }
        } catch (eTop) {}
        return docs;

    function waitForNativeSelectIdDialog(docs, onOpen, onClose) {
        var sawDialog = false;
        var start = Date.now();
        var pollId = window.setInterval(function () {
            var open = isNativeAdminSelectIdOpen(docs);
            if (open && !sawDialog) {
                sawDialog = true;
                if (typeof onOpen === 'function') {
                    onOpen();
                }
            }
            if (sawDialog && !open) {
                window.clearInterval(pollId);
                if (typeof onClose === 'function') {
                    onClose(true);
                }
                return;
            }
            if (!sawDialog && Date.now() - start > 2500) {
                window.clearInterval(pollId);
                if (typeof onClose === 'function') {
                    onClose(false);
                }
            }
            if (Date.now() - start > 180000) {
                window.clearInterval(pollId);
                if (typeof onClose === 'function') {
                    onClose(sawDialog);
                }
            }
        }, 120);
        return function cancel() {
            window.clearInterval(pollId);
        };
    }

    function openNativeRowObjectIdPicker(row, table, currentValue, callback) {
        var cell = getNameObjectIdCell(row, table);
        if (!cell) {
            return false;
        }
        var nativeInput = getCellInput(cell);
        var pickBtn = findObjectIdPickButton(cell);
        if (!nativeInput || !pickBtn) {
            return false;
        }
        var pickerDocs = collectPickerDocuments(row.ownerDocument);
        var originalName = getObjectIdCellValue(cell);
        var startVal = currentValue != null ? String(currentValue).trim() : originalName;
        if (startVal !== originalName) {
            setReactInputValue(nativeInput, startVal);
        }

        var session = {
            closed: false,
            applied: false,
            okPressed: false,
            captureStarted: false,
            originalName: originalName,
            lastTreeId: startVal || '',
            callback: callback,
            cell: cell,
            nativeInput: nativeInput,
            removeFns: [],
            restoreTable: function () {
                if (getObjectIdCellValue(cell) !== originalName) {
                    setReactInputValue(nativeInput, originalName);
                }
            },
            tryApply: function (pickedId) {
                if (session.closed || session.applied) {
                    return;
                }
                if (!session.okPressed) {
                    return;
                }
                var t = String(pickedId || session.lastTreeId || '').trim();
                if (!t || t === originalName || !looksLikeObjectId(t)) {
                    return;
                }
                session.applied = true;
                session.restoreTable();
                if (typeof callback === 'function') {
                    callback(t);
                }
                session.end(true);
            },
            end: function (keepApplied) {
                if (session.closed) {
                    return;
                }
                session.closed = true;
                if (!keepApplied && !session.applied) {
                    session.restoreTable();
                }
                session.removeFns.forEach(function (fn) {
                    try {
                        fn();
                    } catch (eRm) {}
                });
                session.removeFns = [];
                try {
                    var top = getTopWin(row.ownerDocument);
                    if (top && top.__bwOidPickSession === session) {
                        top.__bwOidPickSession = null;
                    }
                } catch (eTop) {}
            }
        };

        try {
            var topWin = getTopWin(row.ownerDocument);
            if (topWin) {
                topWin.__bwOidPickSession = session;
            }
        } catch (eSet) {}

        beginNativeOidPickCapture(pickerDocs, session);

        var cancelWait = waitForNativeSelectIdDialog(pickerDocs, function () {
            beginNativeOidPickCapture(pickerDocs, session);
        }, function () {
            window.setTimeout(function () {
                if (!session.applied) {
                    session.end(false);
                }
            }, 700);
        });

        dispatchNativeClick(pickBtn);
        window.setTimeout(function () {
            if (!session.closed && !session.applied && !isNativeAdminSelectIdOpen(pickerDocs)) {
                var inner = cell.querySelector('[data-bw-dots-inner="1"]') || pickBtn;
                dispatchNativeClick(inner);
            }
        }, 160);
        window.setTimeout(function () {
            if (!session.closed) {
                beginNativeOidPickCapture(pickerDocs, session);
            }
        }, 300);
        return true;
    }

    function readActiveChecked(cell) {
        if (!cell) {
            return false;
        }
        var input = cell.querySelector('input[type="checkbox"]');
        if (input) {
            return !!input.checked;
        }
        var toggle = cell.querySelector('[data-bw-active-toggle="1"]');
        if (toggle && toggle.hasAttribute('data-bw-active')) {
            return toggle.getAttribute('data-bw-active') === '1';
        }
        var muiCb = cell.querySelector('.MuiCheckbox-root');
        return !!(muiCb && muiCb.classList.contains('Mui-checked'));
    }

    function setNativeActiveChecked(cell, muiCb, input, want, silent) {
        if (!cell || !input) {
            return !!want;
        }
        var checked = !!want;
        try {
            var desc = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'checked');
            if (desc && desc.set) {
                desc.set.call(input, checked);
            } else {
                input.checked = checked;
            }
        } catch (eSet) {
            input.checked = checked;
        }
        if (muiCb) {
            if (checked) {
                muiCb.classList.add('Mui-checked');
            } else {
                muiCb.classList.remove('Mui-checked');
            }
            var iconBtn = muiCb.querySelector('.MuiIconButton-root');
            if (iconBtn) {
                iconBtn.setAttribute('aria-checked', checked ? 'true' : 'false');
            }
        }
        if (!silent) {
            input.dispatchEvent(new Event('input', { bubbles: true }));
            input.dispatchEvent(new Event('change', { bubbles: true }));
        }
        return checked;
    }

    function invokeTab2ConfigField(input, value) {
        if (!input) {
            return false;
        }
        var fiberKey = '';
        var keys = Object.keys(input);
        var i;
        for (i = 0; i < keys.length; i += 1) {
            if (keys[i].indexOf('__reactFiber') === 0) {
                fiberKey = keys[i];
                break;
            }
        }
        var fiber = fiberKey ? input[fiberKey] : null;
        var n = 0;
        while (fiber && n < 40) {
            var props = fiber.memoizedProps;
            if (props && props.attr && typeof props.onChange === 'function') {
                props.onChange(props.attr, value);
                return true;
            }
            fiber = fiber.return;
            n += 1;
        }
        return false;
    }

    function invokeTab2CheckboxField(cell, want) {
        var input = cell ? cell.querySelector('input[type="checkbox"]') : null;
        return invokeTab2ConfigField(input, !!want);
    }

    function updateTab2ReactRows(input, rowIndex, patch) {
        if (!input || !patch || rowIndex < 0) {
            return false;
        }
        var fiberKey = '';
        var keys = Object.keys(input);
        var i;
        for (i = 0; i < keys.length; i += 1) {
            if (keys[i].indexOf('__reactFiber') === 0) {
                fiberKey = keys[i];
                break;
            }
        }
        var fiber = fiberKey ? input[fiberKey] : null;
        var node = null;
        var n = 0;
        while (fiber && n < 70) {
            var state = fiber.stateNode && fiber.stateNode.state;
            if (state && Array.isArray(state.value) && state.value[0] && state.value[0].zeit !== undefined) {
                node = fiber.stateNode;
                break;
            }
            fiber = fiber.return;
            n += 1;
        }
        if (!node || !node.state.value[rowIndex]) {
            return false;
        }
        var rows;
        try {
            rows = JSON.parse(JSON.stringify(node.state.value));
        } catch (eClone) {
            return false;
        }
        Object.keys(patch).forEach(function (key) {
            rows[rowIndex][key] = patch[key];
        });
        node.setState({ value: rows }, function () {
            try {
                if (typeof node.validateUniqueProps === 'function') {
                    node.validateUniqueProps();
                }
                if (typeof node.onChangeWrapper === 'function') {
                    node.onChangeWrapper(rows, true);
                }
            } catch (eCb) {}
        });
        return true;
    }

    function applyTab2WechselMode(row, table, mode) {
        if (!row || !table || !isTab2VentilTable(table)) {
            return;
        }
        var clockCell = getActiveCell(row);
        var astroCell = getAstroEinCell(row, table);
        if (!clockCell) {
            return;
        }
        var wantAktiv = mode === 'clock' || mode === 'astro';
        var wantAstro = mode === 'astro';
        row.setAttribute('data-bw-schleife-sync', '1');
        row.setAttribute('data-bw-astro-sync', '1');
        var clockInput = clockCell.querySelector('input[type="checkbox"]');
        var astroInput = astroCell ? astroCell.querySelector('input[type="checkbox"]') : null;
        var rowIndex = getTimeRowIndex(row, table);
        var patched = updateTab2ReactRows(clockInput || astroInput, rowIndex, {
            enabled: wantAktiv,
            astroEin: wantAstro
        });
        if (!patched) {
            if (clockInput) {
                invokeTab2CheckboxField(clockCell, wantAktiv);
            }
            if (astroInput) {
                invokeTab2CheckboxField(astroCell, wantAstro);
            }
        }
        if (clockInput) {
            setNativeActiveChecked(clockCell, clockCell.querySelector('.MuiCheckbox-root'), clockInput, wantAktiv, true);
        }
        if (astroInput) {
            setNativeActiveChecked(astroCell, astroCell.querySelector('.MuiCheckbox-root'), astroInput, wantAstro, true);
        }
        markActiveUserChange(row);
        syncTab2ModeToggles(row, table);
        if (wantAstro) {
            refreshTab2AstroPanelForRow(row, table, parentDoc() || row.ownerDocument || null, true);
        }
        pushTimeActiveStates(row, table, wantAktiv, { skipNative: !!clockInput });
        pushTimeAstroStates(row, table, wantAstro, { skipNative: !!astroInput });
        window.setTimeout(function () {
            row.removeAttribute('data-bw-schleife-sync');
            row.removeAttribute('data-bw-astro-sync');
        }, 0);
    }

            var clockOn = tab2ClockModeOn(row, ventilTableEarly);
            applyTab2WechselMode(row, ventilTableEarly, clockOn ? 'off' : 'clock');
            return !clockOn;
        }
        if (ventilTableEarly && ventilTableEarly.getAttribute('data-bw-events-table') === '1' && row &&
            !isTab2VentilTable(ventilTableEarly)) {
            if (isRowObjectIdDuplicate(row, ventilTableEarly)) {
                applySchleifeActiveToRow(row, ventilTableEarly, false);
                flashObjectIdDuplicateHint(ventilTableEarly);

        input.click();
        var checked = readActiveChecked(cell);
        if (toggleBtn) {

        }
        var ventilTable = row ? row.closest('.MuiTable-root') : null;
        if (ventilTable && ventilTable.getAttribute('data-bw-events-table') === '1' && row) {
            if (isTab2VentilTable(ventilTable)) {
                pushTimeActiveStates(row, ventilTable, checked);
            } else {
                pushVentilActiveStates(row, ventilTable, checked);
            }
        }
        return checked;
    }

    var bwSchwelleFarbeCache = {};

    function schwelleBool(val) {
        if (val === true || val === 1) {
            return true;
        }
        var s = String(val == null ? '' : val).trim().toLowerCase();
        return s === 'true' || s === '1' || s === 'on' || s === 'ein';
    }

    /** Wie „Schwelle überschritten“: Ja = rot, Nein = grün. Ohne aktive Schwelle bleibt der Button weiß. */
    function schwelleFarbeAusWerten(bag) {
        var fAktiv = schwelleBool(bag.feuchtAktiv);
        var tAktiv = schwelleBool(bag.tempAktiv);
        if (!fAktiv && !tAktiv) {
            return 'weiss';
        }
        return schwelleBool(bag.ueberschritten) ? 'rot' : 'gruen';
    }

    function applyTab1SchwelleFarbe(table) {
        if (!isTab1VentilTable(table)) {
            return;
        }
        getVentilDataRows(table).forEach(function (row) {
            var nr = resolveVentilNrForRow(row, table);
            var farbe = bwSchwelleFarbeCache[nr] || 'weiss';
            if (row.getAttribute('data-bw-schwelle-farbe') !== farbe) {
                row.setAttribute('data-bw-schwelle-farbe', farbe);
            }
            row.querySelectorAll('[data-bw-name-input="1"]').forEach(function (inp) {
                inp.removeAttribute('data-bw-name-input');
            });
            var nameCell = getNameCell(row, table);
            if (!nameCell) {
                return;
            }
            var nameColor = tab1SchwelleNameColor(farbe);
            nameCell.querySelectorAll('input, textarea').forEach(function (inp) {
                inp.setAttribute('data-bw-name-input', '1');
                inp.style.setProperty('color', nameColor, 'important');
                inp.style.setProperty('-webkit-text-fill-color', nameColor, 'important');
            });
            var edit = row.querySelector('[data-bw-edit-btn="1"]');
            if (edit) {
                syncPressableVisual(edit);
            }
        });
    }

    function refreshTab1SchwelleFarben(table, doc) {
        applyTab1SchwelleFarbe(table);
        var now = Date.now();
        if (bwSchwelleFarbeBusy || (now - bwSchwelleFarbeAt) < 2000) {
            return;
        }
        bwSchwelleFarbeBusy = true;
        bwSchwelleFarbeAt = now;
        var busyWatch = window.setTimeout(function () {
            bwSchwelleFarbeBusy = false;
        }, 4000);
        getAdminSocketAsync(doc, function (err, socket) {
            if (err || !socket || !table.isConnected) {
                window.clearTimeout(busyWatch);
                bwSchwelleFarbeBusy = false;
                return;
            }
            var rows = getVentilDataRows(table);
            var leftRows = rows.length;
            if (!leftRows) {
                bwSchwelleFarbeBusy = false;
                return;
            }
            var paths = {
                feuchtAktiv: 'Schwelle.FeuchtigkeitAktiv',
                tempAktiv: 'Schwelle.TemperaturAktiv',
                ueberschritten: 'Schwelle.Ueberschritten'
            };
            var keys = Object.keys(paths);
            rows.forEach(function (row) {
                var nr = resolveVentilNrForRow(row, table);
                var bag = {};
                var pending = keys.length;
                keys.forEach(function (key) {
                    getStateViaAdmin(socket, ventilDpId(nr, paths[key]), function (e2, state) {
                        bag[key] = state && Object.prototype.hasOwnProperty.call(state, 'val') ? state.val : null;
                        pending -= 1;
                        if (pending > 0) {
                            return;
                        }
                        bwSchwelleFarbeCache[nr] = schwelleFarbeAusWerten(bag);
                        leftRows -= 1;
                        if (leftRows <= 0) {
                            window.clearTimeout(busyWatch);
                            bwSchwelleFarbeBusy = false;
                            if (table.isConnected) {
                                applyTab1SchwelleFarbe(table);
                                applyParallelRows(table);
                            }
                        }
                    });
                });
            });
        });
    }

    function ensureTab2Colgroup(table) {
        if (!isTab2VentilTable(table)) {
            return;
        }
        var headRow = table.querySelector('.MuiTableHead-root .MuiTableRow-root, .MuiTableHead-root tr');
        if (!headRow) {
            return;
        }
        var headCells = headRow.querySelectorAll(':scope > .MuiTableCell-root, :scope > th, :scope > td');
        var tableEl = table.tagName === 'TABLE' ? table : table.querySelector('table.MuiTable-table, table');
        if (!tableEl || !headCells.length) {
            return;
        }
        var colgroup = tableEl.querySelector('colgroup[data-bw-tab2-cols="1"]');
        if (!colgroup) {
            colgroup = tableEl.ownerDocument.createElement('colgroup');
            colgroup.setAttribute('data-bw-tab2-cols', '1');
            tableEl.insertBefore(colgroup, tableEl.firstChild);
        }
        var colSig = headCells.length + ':' + Array.prototype.map.call(headCells, function (cell) {
            return cell.getAttribute('data-bw-col-kind') || '';
        }).join('|');
        if (colgroup.getAttribute('data-bw-col-sig') === colSig &&
            colgroup.childElementCount === headCells.length) {
            return;
        }
        colgroup.setAttribute('data-bw-col-sig', colSig);
        while (colgroup.firstChild) {
            colgroup.removeChild(colgroup.firstChild);
        }
        var i;
        for (i = 0; i < headCells.length; i += 1) {
            var col = tableEl.ownerDocument.createElement('col');
            var kind = headCells[i].getAttribute('data-bw-col-kind');
            if (!kind && i === headCells.length - 1) {
                kind = 'action';
            }
            col.style.width = tab2ColWidthForKind(kind || '');
            if (!col.style.width) {
                col.removeAttribute('style');
            }
            colgroup.appendChild(col);
        }
        tableEl.style.removeProperty('table-layout');
        tableEl.style.setProperty('width', '100%', 'important');
    }

                if (label === 'Ein' || label === 'On' || seenClockAktiv) {
                    cell.setAttribute('data-bw-col-kind', 'ein');

                cell.setAttribute('data-bw-col-kind', 'zeit');
                alignTab2ZeitCell(cell);

                cell.setAttribute('data-bw-col-kind', 'wochentag');

                cell.setAttribute('data-bw-astro-head', '1');

    function syncTab2ZeitMasterDim(doc, on) {
        var root = getAdapterRoot(doc);
        if (!root) {
            return;

        root.querySelectorAll('[data-bw-zeit-dim="1"]').forEach(function (el) {
            el.removeAttribute('data-bw-zeit-dim');
            el.style.removeProperty('filter');
            el.style.removeProperty('opacity');

        if (on) {
            return;
        }
        var row = root.querySelector('[data-bw-tab2-zeit-row="1"]');
        var table = root.querySelector('.MuiTable-root[data-bw-tab2-events-table="1"]');
        if (!row || !table || row.contains(table)) {
            return;
        }
        var node = row;
        while (node && node.parentElement && node !== root) {
            var parent = node.parentElement;
            var past = false;
            var targets = [];
            var i;
            for (i = 0; i < parent.children.length; i += 1) {
                var child = parent.children[i];
                if (child === node || child.contains(row)) {
                    past = true;
                    continue;
                }
                if (past) {
                    if (child.getAttribute && child.getAttribute('data-bw-saison-row') === '1') {
                        continue;
                    }
                    targets.push(child);
                }
            }
            var hitsTable = false;
            for (i = 0; i < targets.length; i += 1) {
                if (targets[i] === table || targets[i].contains(table)) {
                    hitsTable = true;
                    break;
                }
            }
            if (hitsTable) {
                targets.forEach(function (el) {
                    if (el.contains(row)) {
                        return;
                    }
                    el.setAttribute('data-bw-zeit-dim', '1');
                    el.style.setProperty('filter', 'grayscale(1)', 'important');
                    el.style.setProperty('opacity', '0.68', 'important');
                });
                return;
            }
            node = parent;
        }
    }

    var SAISON_DEFAULTS = { sommerVon: '31.03', sommerBis: '31.10', winterVon: '01.11', winterBis: '28.02' };

    function saisonNormalize(val, fallback) {
        var m = String(val || '').trim().match(/^(\d{1,2})\.(\d{1,2})$/);
        if (!m) {
            return fallback;
        }
        var tag = parseInt(m[1], 10);
        var monat = parseInt(m[2], 10);
        if (monat < 1 || monat > 12 || tag < 1 || tag > 31) {
            return fallback;
        }
        return (tag < 10 ? '0' : '') + tag + '.' + (monat < 10 ? '0' : '') + monat;
    }

    function saisonCode(ttmm) {
        var m = String(ttmm || '').match(/^(\d{2})\.(\d{2})$/);
        if (!m) {
            return null;
        }
        return parseInt(m[2], 10) * 100 + parseInt(m[1], 10);
    }

    function saisonEnthaelt(now, von, bis) {
        var a = saisonCode(von);
        var b = saisonCode(bis);
        if (a == null || b == null) {
            return false;
        }
        var heute = (now.getMonth() + 1) * 100 + now.getDate();
        if (a <= b) {
            return heute >= a && heute <= b;
        }
        return heute >= a || heute <= b;
    }

    function saisonRestBis(now, winterBis) {
        var code = saisonCode(winterBis);
        if (code == null) {
            return winterBis;
        }
        var monat = Math.floor(code / 100);
        var tag = code % 100;
        var jahr = now.getFullYear();
        var heute = (now.getMonth() + 1) * 100 + now.getDate();
        if (code < heute) {
            jahr += 1;
        }
        return (tag < 10 ? '0' : '') + tag + '.' + (monat < 10 ? '0' : '') + monat + '.' + jahr;
    }

    function saisonFieldInput(doc, attr) {
        var root = getAdapterRoot(doc);
        if (!root) {
            return null;
        }
        var inputs = root.querySelectorAll('input');
        var i;
        var needle = String(attr || '').toLowerCase();
        for (i = 0; i < inputs.length; i += 1) {
            var key = ((inputs[i].id || '') + ' ' + (inputs[i].name || '')).toLowerCase();
            if (key.indexOf(needle) >= 0) {
                return inputs[i];
            }
        }
        var labels = {
            saisonsommervon: 'Sommer von',
            saisonsommerbis: 'Sommer bis',
            saisonwintervon: 'Winter von',
            saisonwinterbis: 'Winter bis'
        };
        var want = labels[needle];
        if (!want) {
            return null;
        }
        var nodes = root.querySelectorAll('label, span, p, div');
        for (i = 0; i < nodes.length; i += 1) {
            var el = nodes[i];
            if (el.children && el.children.length > 3) {
                continue;
            }
            var text = (el.textContent || '').replace(/\s+/g, ' ').trim();
            if (text !== want) {
                continue;
            }
            var box = el.closest('.MuiFormControl-root, .MuiGrid-item, .MuiGrid2-root') || el.parentElement;
            var input = box && box.querySelector('input:not([type="checkbox"])');
            if (input) {
                return input;
            }
        }
        return null;
    }

    function readSaisonWerte(doc) {
        function read(attr, fallback) {
            var input = saisonFieldInput(doc, attr);
            return saisonNormalize(input && input.value, fallback);
        }
        return {
            sommerVon: read('saisonsommervon', SAISON_DEFAULTS.sommerVon),
            sommerBis: read('saisonsommerbis', SAISON_DEFAULTS.sommerBis),
            winterVon: read('saisonwintervon', SAISON_DEFAULTS.winterVon),
            winterBis: read('saisonwinterbis', SAISON_DEFAULTS.winterBis)
        };
    }

    function saisonAnzeige(werte, now) {
        var sommer = saisonEnthaelt(now, werte.sommerVon, werte.sommerBis);
        if (sommer) {
            return { on: true, text: 'Sommer ' + werte.sommerVon + '–' + werte.sommerBis };
        }
        return {
            on: false,
            text: 'Winter ' + werte.winterVon + '–' + werte.winterBis + ' · restlich bis ' + saisonRestBis(now, werte.winterBis)
        };
    }

    function hideSaisonNativeFields(doc) {
        ['saisonsommervon', 'saisonsommerbis', 'saisonwintervon', 'saisonwinterbis'].forEach(function (attr) {
            var input = saisonFieldInput(doc, attr);
            if (!input) {
                return;
            }
            var row = input.closest('.MuiGrid-item, .MuiGrid2-root');
            if (row && !row.querySelector('[data-bw-tab2-zeit-row="1"]')) {
                row.style.setProperty('display', 'none', 'important');

    function writeSaisonWerte(doc, werte) {
        var map = {
            saisonSommerVon: werte.sommerVon,
            saisonSommerBis: werte.sommerBis,
            saisonWinterVon: werte.winterVon,
            saisonWinterBis: werte.winterBis
        };
        Object.keys(map).forEach(function (attr) {
            var input = saisonFieldInput(doc, attr);
            if (!input) {
                return;
            }
            setReactInputValue(input, map[attr]);
            commitJsonConfigAttr(input, attr, map[attr]);
        });
        getAdminSocketAsync(doc, function (err, socket) {
            if (err || !socket) {
                return;
            }
            setStateViaAdmin(socket, BW_ADAPTER_NS + '.Steuerung.Saison.SommerVon', werte.sommerVon, function () {});
            setStateViaAdmin(socket, BW_ADAPTER_NS + '.Steuerung.Saison.SommerBis', werte.sommerBis, function () {});
            setStateViaAdmin(socket, BW_ADAPTER_NS + '.Steuerung.Saison.WinterVon', werte.winterVon, function () {});
            setStateViaAdmin(socket, BW_ADAPTER_NS + '.Steuerung.Saison.WinterBis', werte.winterBis, function () {});
        });
    }

    var bwPause = { aktiv: false, von: '', bis: '', loaded: false, loading: false, at: 0 };

    function pauseParse(val) {
        var m = String(val || '').trim().match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
        if (!m) {
            return null;
        }
        var tag = parseInt(m[1], 10);
        var monat = parseInt(m[2], 10);
        var jahr = parseInt(m[3], 10);
        var d = new Date(jahr, monat - 1, tag);
        if (d.getFullYear() !== jahr || d.getMonth() !== monat - 1 || d.getDate() !== tag) {
            return null;
        }
        d.setHours(0, 0, 0, 0);
        return d;
    }

    function pauseFormat(d) {
        var tag = d.getDate();
        var monat = d.getMonth() + 1;
        return (tag < 10 ? '0' : '') + tag + '.' + (monat < 10 ? '0' : '') + monat + '.' + d.getFullYear();
    }

    function pauseHeute() {
        var n = new Date();
        n.setHours(0, 0, 0, 0);
        return n;
    }

    function pauseDefaultBis(von) {
        var bis = new Date(von.getFullYear(), 1, 28);
        if (bis < von) {
            bis = new Date(von.getFullYear() + 1, 1, 28);
        }
        return bis;
    }

    function pauseZeitraumGueltig() {
        var von = pauseParse(bwPause.von);
        var bis = pauseParse(bwPause.bis);
        return !!(von && bis && bis >= von && bis >= pauseHeute());
    }

    function pauseAnzeige() {
        var von = pauseParse(bwPause.von);
        var bis = pauseParse(bwPause.bis);
        var heute = pauseHeute();
        var an = !!bwPause.aktiv && !!von && !!bis && heute <= bis;
        var text = 'Zeitraum wählen';
        if (von && bis) {
            text = (an && heute >= von) ? ('bis ' + bwPause.bis) : (bwPause.von + '–' + bwPause.bis);
        }
        return { on: an, text: text };
    }

    function loadPause(doc, done) {
        if (bwPause.loading) {
            if (done) {
                done();
            }
            return;
        }
        bwPause.loading = true;
        bwPause.at = Date.now();
        getAdminSocketAsync(doc, function (err, socket) {
            if (err || !socket) {
                bwPause.loading = false;
                if (done) {
                    done();
                }
                return;
            }
            var left = 3;
            function fin() {
                left -= 1;
                if (left > 0) {
                    return;
                }
                bwPause.loaded = true;
                bwPause.loading = false;
                if (done) {
                    done();
                }
            }
            getStateViaAdmin(socket, BW_ADAPTER_NS + '.Steuerung.Pause.Aktiv', function (e, state) {
                if (!e && state && Object.prototype.hasOwnProperty.call(state, 'val')) {
                    bwPause.aktiv = state.val === true || state.val === 1 || String(state.val).toLowerCase() === 'true';
                }
                fin();
            });
            getStateViaAdmin(socket, BW_ADAPTER_NS + '.Steuerung.Pause.Von', function (e, state) {
                if (!e && state && state.val) {
                    bwPause.von = String(state.val);
                }
                fin();
            });
            getStateViaAdmin(socket, BW_ADAPTER_NS + '.Steuerung.Pause.Bis', function (e, state) {
                if (!e && state && state.val) {
                    bwPause.bis = String(state.val);
                }
                fin();
            });
        });
    }

    function writePause(doc, werte, done) {
        if (werte.von) {
            bwPause.von = werte.von;
        }
        if (werte.bis) {
            bwPause.bis = werte.bis;
        }
        if (typeof werte.aktiv === 'boolean') {
            bwPause.aktiv = werte.aktiv;
        }
        getAdminSocketAsync(doc, function (err, socket) {
            if (err || !socket) {
                if (done) {
                    done(err || 'keine Verbindung');
                }
                return;
            }
            setStateViaAdmin(socket, BW_ADAPTER_NS + '.Steuerung.Pause.Von', bwPause.von || '', function () {
                setStateViaAdmin(socket, BW_ADAPTER_NS + '.Steuerung.Pause.Bis', bwPause.bis || '', function () {
                    setStateViaAdmin(socket, BW_ADAPTER_NS + '.Steuerung.Pause.Aktiv', !!bwPause.aktiv, function () {
                        if (done) {
                            done(null);
                        }
                    });
                });
            });
        });
    }

    function tab1ParallelKandidaten(table, eigeneNr, eigeneRow) {
        var liste = [];
        var gesehen = {};
        if (!table) {
            return liste;
        }
        getVentilDataRows(table).forEach(function (row, idx) {
            if (eigeneRow && row === eigeneRow) {
                return;
            }
            var n = ventilIdentityNr(row, table);
            if (!n) {
                n = idx + 1;
            }
            if (!n || n === eigeneNr || gesehen[n]) {
                return;
            }
            gesehen[n] = true;
            liste.push({ nr: n, name: tab1VentilName(row, table, n), row: row });
        });
        if (!liste.length) {
            getVentilDataRows(table).forEach(function (row, idx) {
                if (eigeneRow && row === eigeneRow) {
                    return;
                }
                var n = idx + 1;
                if (n === eigeneNr || gesehen[n]) {
                    return;
                }
                gesehen[n] = true;
                liste.push({ nr: n, name: tab1VentilName(row, table, n), row: row });
            });
        }
        liste.sort(function (a, b) {
            return a.nr - b.nr;
        });

    function applyParallelRows(table) {
        if (!table || !isTab1VentilTable(table)) {
            return;
        }
        var rows = getVentilDataRows(table).map(function (row) {
            return { row: row, nr: ventilIdentityNr(row, table) };
        }).filter(function (item) {
            return item.nr;
        });
        rows.sort(function (a, b) {
            return a.nr - b.nr;
        });
        var rolle = {};
        var titel = {};
        rows.forEach(function (item) {
            if (!bwParallelCache[item.nr]) {
                return;
            }
            var auswahl = bwParallelAuswahlCache[item.nr] || [];
            if (!auswahl.length) {
                return;
            }
            rolle[item.nr] = rolle[item.nr] || 'lead';
            var namen = [];
            auswahl.forEach(function (pnr) {
                if (!rolle[pnr]) {
                    rolle[pnr] = 'partner';
                }
                var partner = null;
                var i;
                for (i = 0; i < rows.length; i += 1) {
                    if (rows[i].nr === pnr) {
                        partner = rows[i];
                        break;
                    }
                }
                namen.push(partner ? tab1VentilName(partner.row, table, pnr) : ('Ventil' + pnr));
            });
            titel[item.nr] = 'Parallelbetrieb: zusammen mit ' + namen.join(', ');
        });
        rows.forEach(function (item) {
            if (rolle[item.nr] === 'partner' && !titel[item.nr]) {
                titel[item.nr] = 'Parallelbetrieb: wird zusammen mit einem anderen Ventil gesteuert';
            }
            applyParallelRow(item.row, table, !!rolle[item.nr], titel[item.nr] || '');
        });
    }

    function bindParallelControl(panel, hostDoc, socket, nr, row, table) {
        if (!panel || !socket || !nr) {
            return;
        }
        var box = panel.querySelector('[data-bw-vip-parallel="1"]');
        var host = panel.querySelector('[data-bw-vip-parallel-list="1"]');
        if (!box || box.getAttribute('data-bw-parallel-wired') === '1') {
            return;
        }
        box.setAttribute('data-bw-parallel-wired', '1');
        function aktuelleTabelle() {
            return tabelleFuerPanel(panel, row, table) || tab1Tabelle(hostDoc);
        }
        function paint(val) {
            box.checked = !!val;
            bwParallelCache[nr] = !!val;
            renderParallelAuswahl(panel, aktuelleTabelle(), nr, row);
            var liveTable = aktuelleTabelle();
            if (liveTable) {
                applyParallelRows(liveTable);
            }
        }
        renderParallelAuswahl(panel, aktuelleTabelle(), nr, row);
        if (host && host.getAttribute('data-bw-parallel-list-wired') !== '1') {
            host.setAttribute('data-bw-parallel-list-wired', '1');
            host.addEventListener('change', function (ev) {
                var ziel = ev.target;
                if (!ziel || ziel.getAttribute('data-bw-vip-parallel-nr') == null) {
                    return;
                }
                var nums = [];
                host.querySelectorAll('input[data-bw-vip-parallel-nr]').forEach(function (inp) {
                    if (!inp.checked) {
                        return;
                    }
                    var gewaehlt = parseInt(inp.getAttribute('data-bw-vip-parallel-nr'), 10) || 0;
                    if (gewaehlt > 0 && gewaehlt !== nr) {
                        nums.push(gewaehlt);
                    }
                });
                var an = nums.length > 0;
                box.checked = an;
                bwParallelCache[nr] = an;
                ensureParallelState(socket, nr, function () {
                    setStateViaAdmin(socket, parallelStateId(nr), an, function () {
                        speichereParallelAuswahl(socket, hostDoc, nr, nums, function (setErr) {
                            if (setErr) {
                                alertVentilErr(hostDoc, setErr);
                                renderParallelAuswahl(panel, aktuelleTabelle(), nr, row);
                                return;
                            }
                            var liveTable = aktuelleTabelle();
                            if (liveTable) {
                                applyParallelRows(liveTable);
                            }
                        });
                    });
                });
            });
        }
        ensureParallelState(socket, nr, function () {
            ensureParallelVentileState(socket, nr, function () {
                getStateViaAdmin(socket, parallelStateId(nr), function (err, state) {
                    if (!box.isConnected) {
                        return;
                    }
                    var val = !err && state && (state.val === true || state.val === 1 || state.val === 'true');
                    getStateViaAdmin(socket, parallelVentileStateId(nr), function (aErr, auswahlState) {
                        if (!box.isConnected) {
                            return;
                        }
                        if (!aErr && auswahlState) {
                            bwParallelAuswahlCache[nr] = parseParallelAuswahl(auswahlState.val);
                        }
                        paint(val);
                    });
                });
            });
        });
        box.addEventListener('change', function () {
            var next = !!box.checked;
            if (!next) {
                bwParallelAuswahlCache[nr] = [];
            }
            paint(next);
            ensureParallelState(socket, nr, function (ensureErr) {
                if (ensureErr) {
                    alertVentilErr(hostDoc, ensureErr);
                    return;
                }
                setStateViaAdmin(socket, parallelStateId(nr), next, function (setErr) {
                    if (setErr) {
                        alertVentilErr(hostDoc, setErr);
                        paint(!next);
                        return;
                    }
                    if (!next) {
                        speichereParallelAuswahl(socket, hostDoc, nr, [], function () {});
                    }
                });
            });
        });
    }

                row.removeAttribute('data-bw-ausgang-row');

    function refreshTab1AusgangSwitches(table, doc) {
        if (!table || !isTab1VentilTable(table)) {
            return;
        }
        var now = Date.now();
        if (bwAusgangBusy || (now - bwAusgangAt) < 1500) {
            applyTab1AusgangLock(doc);
            if (table.isConnected) {
                tab1UebernehmeAusgangZeilen(table);
                getVentilDataRows(table).forEach(function (r) {
                    applyTab1AusgangVisual(r, table);
                });
            }
            return;
        }
        bwAusgangBusy = true;
        bwAusgangAt = now;
        var watch = window.setTimeout(function () {
            bwAusgangBusy = false;
        }, 4000);
        getAdminSocketAsync(doc, function (err, socket) {
            if (err || !socket) {
                window.clearTimeout(watch);
                bwAusgangBusy = false;
                return;
            }
            var rows = getVentilDataRows(table);
                var left = rows.length;
                if (!left) {
                    window.clearTimeout(watch);
                    bwAusgangBusy = false;
                    return;
                }
                rows.forEach(function (row) {
                    var oid = tab1RowAusgangId(row, table);
                    function doneRow() {
                        left -= 1;
                        if (left > 0) {
                            return;
                        }
                        window.clearTimeout(watch);
                        bwAusgangBusy = false;
                        if (table.isConnected) {
                            tab1UebernehmeAusgangZeilen(table);
                            getVentilDataRows(table).forEach(function (r) {
                                applyTab1AusgangVisual(r, table);
                            });
                        }
                    }
                    if (!oid) {
                        doneRow();
                        return;
                    }
                    getStateViaAdmin(socket, oid, function (e2, state) {
                        if (!e2 && state && Object.prototype.hasOwnProperty.call(state, 'val') && Date.now() > (bwAusgangHold[oid] || 0)) {
                            bwAusgangCache[oid] = ausgangIstAn(state.val);

                        doneRow();
                    });
                });
        });

    function ventilNrFromGridChild(ch) {
        if (!ch) {
            return 0;
        }
        var html = ch.innerHTML || '';
        var m = html.match(/Ventil([1-4])\./);
        if (m) {
            return parseInt(m[1], 10);
        }
        var labels = ch.querySelectorAll('.MuiTypography-root, h4, h5, h6');
        var i;
        var lt;
        var hm;
        for (i = 0; i < labels.length; i += 1) {
            lt = (labels[i].textContent || '').replace(/\s+/g, ' ').trim();
            if (lt.length > 100) {
                continue;
            }
            hm = lt.match(/^Ventil\s+([1-4])\s+[–\-]\s+Bew/i) ||
                lt.match(/^Valve\s+([1-4])\s+[–\-]\s+water/i);
            if (hm) {
                return parseInt(hm[1], 10);
            }
        }
        return 0;
    }

    function tagVentilGrid2Siblings(doc) {
        var container = findVentilFieldsContainer(doc);
        if (!container) {
            return 0;
        }
        var children = container.children;
        var i;
        var tableIdx = -1;
        var tagged = 0;
        var ventilIdx = 0;
        for (i = 0; i < children.length; i += 1) {
            if (children[i].querySelector && children[i].querySelector('.MuiTable-root')) {
                tableIdx = i;
            }
        }
        for (i = tableIdx >= 0 ? tableIdx + 1 : 0; i < children.length; i += 1) {
            var ch = children[i];
            if (!ch || !ch.querySelector) {
                continue;
            }
            if (ch.querySelector('iframe[src*="beregnungswerk"]')) {
                break;
            }
            var text = (ch.textContent || '').replace(/\s+/g, ' ').trim();
            if (text.indexOf('direkt mit beregnungswerk') >= 0 || text.indexOf('bound directly') >= 0) {

            }

    function getStateViaAdmin(socket, stateId, done) {
        if (!socket) {
            done('Keine Admin-Verbindung', null);
            return;
        }
        if (typeof socket.getState === 'function') {
            try {
                var p = socket.getState(stateId);
                if (p && typeof p.then === 'function') {
                    p.then(function (state) {
                        done(null, state);
                    }).catch(function (err) {
                        done(adminErrMsg(err) || 'getState fehlgeschlagen', null);
                    });
                    return;
                }
            } catch (e) {
                done(adminErrMsg(e) || 'getState fehlgeschlagen', null);
                return;
            }
        }
        if (typeof socket.emit === 'function') {
            socket.emit('getState', stateId, function (err, state) {
                done(err ? adminErrMsg(err) : null, state);
            });
            return;
        }
        done('getState nicht verfügbar', null);
    }

    function resolveBwAdapterInstanceId(doc) {
        var configDoc = getBeregnungswerkConfigDoc(doc || parentDoc());
        var comp = configDoc ? findAdminConfigPublishTarget(configDoc) : null;
        var inst = null;
        if (comp && comp.props) {
            inst = comp.props.instance || comp.props.adapterInstance || comp.props.name || null;
        }
        if (!inst || String(inst).indexOf('beregnungswerk') < 0) {
            var root = configDoc ? getAdapterRoot(configDoc) : null;
            var fiber = getReactFiberHost(root);
            var depth = 0;
            while (fiber && depth < 120) {
                var sn = fiber.stateNode;
                if (sn && sn.props) {
                    var cand = sn.props.instance || sn.props.adapterInstance || sn.props.name;
                    if (cand && String(cand).indexOf('beregnungswerk') >= 0) {
                        inst = cand;
                        break;
                    }
                }
                fiber = fiber.return;
                depth += 1;
            }
        }
        if (!inst || String(inst).indexOf('beregnungswerk') < 0) {
            try {
                var loc = (configDoc && configDoc.defaultView && configDoc.defaultView.location) ||
                    (window.top && window.top.location) || null;
                var hash = loc ? String(loc.hash || '') : '';
                var path = loc ? String(loc.pathname || '') : '';
                var hm = hash.match(/beregnungswerk\.(\d+)/i) ||
                    hash.match(/beregnungswerk\/(\d+)/i) ||
                    path.match(/beregnungswerk\.(\d+)/i) ||
                    path.match(/beregnungswerk\/(\d+)/i);
                if (hm) {
                    inst = 'beregnungswerk.' + hm[1];
                }
            } catch (eLoc) {}
        }
        if (!inst || String(inst).indexOf('beregnungswerk') < 0) {
            return BW_ADAPTER_NS;
        }
        return String(inst).trim();
    }
