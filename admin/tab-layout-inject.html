    function ensureSchaltzeitStatesForNr(slot, done) {
        if (isSchaltzeitSlotMarkedDeleted(slot)) {
            if (done) {
                done(null, { skipped: true, nr: slot, mode: 'deleted' });
            }
            return;
        }
        getAdminSocketAsync(parentDoc(), function (err, socket) {
            if (err || !socket) {
                if (done) {
                    done(err || new Error('Keine Admin-Verbindung'));
                }
                return;
            }
            function finishEnsure(finishErr, stats) {
                if (done) {
                    done(finishErr, stats);
                }
            }
            function tryAdminFallback(adapterErr) {
                ensureSchaltzeitStatesViaAdmin(socket, slot, function (fbErr, fbStats) {
                    if (fbErr) {
                        finishEnsure(adapterErr || fbErr);
                        return;
                    }
                    finishEnsure(null, fbStats);
                });
            }
            if (typeof socket.sendTo !== 'function') {
                tryAdminFallback(new Error('sendTo nicht verfügbar'));
                return;
            }
            adapterSendTo(socket, 'ensureSchaltzeit', { nr: slot }).then(function (res) {
                if (res && res.error) {
                    tryAdminFallback(new Error(String(res.error)));
                    return;
                }
                objectExistsViaAdmin(socket, schaltzeitDeleteProbeId(slot)).then(function (exists) {
                    if (exists) {
                        finishEnsure(null, (res && res.stats) ? res.stats : res);
                        return;
                    }
                    tryAdminFallback(new Error('Schaltzeit-DP fehlt nach ensureSchaltzeit'));
                });
            }).catch(function (sendErr) {
                tryAdminFallback(sendErr);
            });
        });
    }

    function ensureSchaltzeitStatesViaAdmin(socket, slot, done) {
        var n = parseInt(slot, 10);
        if (!Number.isFinite(n) || n < 1) {
            if (done) {
                done(new Error('Ungültige Schaltzeit-Nr'));
            }
            return;
        }
        adminEnsureChannel(socket, BW_ADAPTER_NS + '.Steuerung', 'Steuerung', function (errSteuerung) {
            if (errSteuerung) {
                if (done) {
                    done(errSteuerung);
                }
                return;
            }
            adminEnsureChannel(socket, BW_ADAPTER_NS + '.Steuerung.Zeitschaltuhr', 'Zeitschaltuhr', function (errZs) {
                if (errZs) {
                    if (done) {
                        done(errZs);
                    }
                    return;
                }
                adminEnsureChannel(socket, schaltzeitSlotChannelId(n), 'Schaltzeit ' + n, function (errSlot) {
                    if (errSlot) {
                        if (done) {
                            done(errSlot);
                        }
                        return;
                    }
                    var bundle = schaltzeitAdminStateBundle(n);
                var idx = 0;
                var created = 0;
                var skipped = 0;
                function next() {
                    if (idx >= bundle.length) {
                        if (done) {
                            done(null, { created: created, skipped: skipped, nr: n, mode: 'admin' });
                        }
                        return;
                    }
                    var def = bundle[idx];
                    idx += 1;
                    getObjectViaAdmin(socket, def.id, function (getErr, existing) {
                        if (existing && (existing._id || existing.type) && existing.type === 'state') {
                            skipped += 1;
                            next();
                            return;
                        }
                        setObjectViaAdmin(socket, def.id, {
                            type: 'state',
                            common: def.common,
                            native: {}
                        }, function (setObjErr) {
                            if (setObjErr) {
                                if (done) {
                                    done(setObjErr);
                                }
                                return;
                            }
                            created += 1;
                            setStateViaAdmin(socket, def.id, def.val, function () {
                                next();
                            });
                        });
                    });
                }
                next();
                });
            });
        });
    }

    function deleteSchaltzeitStatesViaAdmin(socket, slot, done) {

    function deleteSchaltzeitStatesForNr(slot, done) {

    function resolveSchaltzeitDeleteSlot(row, table) {
        if (!row) {
            return 0;
        }
        if (isHardProtectedFirstRow(row, table)) {
            row.setAttribute('data-bw-schaltzeit-slot', '1');
            return 1;
        }
        var stored = parseInt(row.getAttribute('data-bw-schaltzeit-slot'), 10);
        if (Number.isFinite(stored) && stored > 0) {
            return stored;
        }
        var slot = schaltzeitSlotForRowIndex(getTimeRowIndex(row, table));
        if (slot > 0) {
            row.setAttribute('data-bw-schaltzeit-slot', String(slot));
        }
        return slot;
    }

    function isProtectedSchaltzeitSlot(slot) {
        var n = parseInt(slot, 10);
        return Number.isFinite(n) && n === 1;
    }

    function countOtherRowsWithSchaltzeitSlot(table, slot, excludeRow) {
        if (!table || !slot) {
            return 0;
        }
        var count = 0;
        getVentilDataRows(table).forEach(function (row) {
            if (excludeRow && row === excludeRow) {
                return;
            }
            if (resolveSchaltzeitDeleteSlot(row, table) === slot) {
                count += 1;
            }
        });
        return count;
    }

    function rememberRowSchaltzeitDeleteSlot(row, table) {
        return resolveSchaltzeitDeleteSlot(row, table);
    }

    function markSchaltzeitSlotDeleted(table, slot) {
        if (!table || !slot) {
            return;
        }
        cancelPendingSchaltzeitDpEnsure(table);
        table._bwSkipEnsureSchaltzeitSlots = table._bwSkipEnsureSchaltzeitSlots || {};
        table._bwSkipEnsureSchaltzeitSlots[slot] = true;
    }

    function retryPendingSchaltzeitDpDeletes(table) {
        if (!table || !isTab2VentilTable(table) || !table._bwSkipEnsureSchaltzeitSlots) {
            return;
        }
        Object.keys(table._bwSkipEnsureSchaltzeitSlots).forEach(function (key) {
            var slot = parseInt(key, 10);
            if (!Number.isFinite(slot) || slot < 2 || isProtectedSchaltzeitSlot(slot)) {
                return;
            }
            if (table._bwSchaltzeitDeleteInFlight === slot) {
                return;
            }
            table._bwSchaltzeitDeleteInFlight = slot;
            deleteSchaltzeitStatesForNr(slot, function (delErr) {
                table._bwSchaltzeitDeleteInFlight = null;
                if (!delErr) {
                    delete table._bwSkipEnsureSchaltzeitSlots[key];
                }
            });
        });
    }

    function clearSkipEnsureIfSchaltzeitBackInTable(table) {
        if (!table || !table._bwSkipEnsureSchaltzeitSlots) {
            return;
        }
        var present = {};
        getVentilDataRows(table).forEach(function (row) {
            var slot = resolveSchaltzeitDeleteSlot(row, table);
            if (slot > 0) {
                present[slot] = true;
            }
        });
        Object.keys(table._bwSkipEnsureSchaltzeitSlots).forEach(function (key) {
            var n = parseInt(key, 10);
            if (present[n]) {
                delete table._bwSkipEnsureSchaltzeitSlots[n];
            }
        });
    }

    function collectSchaltzeitSlotsFromTable(table) {
        var numbers = [];
        getVentilDataRows(table).forEach(function (row, idx) {
            var slot = schaltzeitSlotForRowIndex(idx);
            if (table && table._bwSkipEnsureSchaltzeitSlots && table._bwSkipEnsureSchaltzeitSlots[slot]) {
                return;
            }
            numbers.push(slot);
        });
        numbers.sort(function (a, b) {
            return a - b;
        });
        return numbers;
    }

    function ensureTableSchaltzeitDps(table, done) {
        if (!table) {
            if (done) {
                done();
            }
            return;
        }
        var numbers = collectSchaltzeitSlotsFromTable(table);
        if (!numbers.length) {
            if (done) {
                done();
            }
            return;
        }
        var idx = 0;
        function next() {
            if (idx >= numbers.length) {
                if (done) {
                    done(null, numbers);
                }
                return;
            }
            var slot = numbers[idx];
            idx += 1;
            ensureSchaltzeitStatesForNr(slot, function (err) {
                if (err) {
                    try {
                        console.warn('ensureTableSchaltzeitDps Schaltzeit' + slot + ':', err);
                    } catch (eLog) {}
                }
                next();
            });
        }
        next();
    }

    var bwEnsureSchaltzeitDpsTimer = null;

    function cancelPendingSchaltzeitDpEnsure(table) {
        if (bwEnsureSchaltzeitDpsTimer) {
            window.clearTimeout(bwEnsureSchaltzeitDpsTimer);
            bwEnsureSchaltzeitDpsTimer = null;
        }
        if (table) {
            table._bwSchaltzeitDpsEnsured = true;
        }
    }

    function scheduleEnsureTableSchaltzeitDps(table) {
        if (!table || !isTab2VentilTable(table) || table._bwSchaltzeitDpsEnsured) {
            return;
        }
        if (bwEnsureSchaltzeitDpsTimer) {
            window.clearTimeout(bwEnsureSchaltzeitDpsTimer);
        }
        bwEnsureSchaltzeitDpsTimer = window.setTimeout(function () {
            bwEnsureSchaltzeitDpsTimer = null;
            clearSkipEnsureIfSchaltzeitBackInTable(table);
            ensureTableSchaltzeitDps(table, function () {
                table._bwSchaltzeitDpsEnsured = true;
                var hostDoc = parentDoc();
                if (hostDoc) {
                    invalidateTab2ZeitDpSync(hostDoc);
                    invalidateTab2WochentagDpSync(hostDoc);
                    invalidateTab2AstroEinDpSync(hostDoc);
                    invalidateTab2AstroDpSync(hostDoc);
                    refreshAllTab2ZeitCells(hostDoc, true, function () {
                        window.setTimeout(function () {
                            flushPendingTab2ZeitToDp(table);
                        }, 0);
                    });
                    refreshAllTab2WochentagPickers(hostDoc, true);
                    refreshAllTab2AstroEinCells(hostDoc, true);
                    refreshAllTab2AstroPanels(hostDoc, true);
                }
            });
        }, 1200);
    }

    function findSchaltzeitDeleteWrap(node, row) {
        return findVentilDeleteWrap(node, row);
    }

    function findSchaltzeitDeleteTarget(node, table) {
        if (!node || !table || !isTab2VentilTable(table)) {
            return null;
        }
        var delWrap = findSchaltzeitDeleteWrap(node, null);
        if (delWrap) {
            var rowWrap = delWrap.closest('.MuiTableRow-root, tr');
            if (rowWrap && isDataRow(rowWrap) && !isOnlyDataRowLeft(rowWrap, table)) {
                return {
                    row: rowWrap,
                    slot: resolveSchaltzeitDeleteSlot(rowWrap, table),
                    wrap: delWrap
                };
            }
        }
        var icon = node.closest('svg[data-testid="DeleteIcon"], svg[data-testid="DeleteOutlineIcon"]');
        if (icon) {
            var rowIcon = icon.closest('.MuiTableRow-root, tr');
            if (rowIcon && isDataRow(rowIcon) && !isOnlyDataRowLeft(rowIcon, table)) {
                return {
                    row: rowIcon,
                    slot: resolveSchaltzeitDeleteSlot(rowIcon, table),
                    wrap: findSchaltzeitDeleteWrap(icon, rowIcon)
                };
            }
        }
        var imgIcon = node.closest('img.bw-action-icon');
        if (imgIcon) {
            var rowImg = imgIcon.closest('.MuiTableRow-root, tr');
            var wrapImg = imgIcon.closest('[data-bw-role="del"]');
            if (rowImg && wrapImg && isDataRow(rowImg) && !isOnlyDataRowLeft(rowImg, table) &&
                wrapImg.getAttribute('data-bw-show') === '1' && wrapImg.getAttribute('data-bw-disabled') !== '1') {
                return {
                    row: rowImg,
                    slot: resolveSchaltzeitDeleteSlot(rowImg, table),
                    wrap: wrapImg
                };
            }
        }
        return null;
    }

    function queueSchaltzeitDpDelete(table, target) {
        if (!target || !target.row || !isTab2VentilTable(table)) {
            return;
        }
        if (isHardProtectedFirstRow(target.row, table)) {
            return;
        }
        rememberRowSchaltzeitDeleteSlot(target.row, table);
        var slot = target.slot > 0 ? target.slot : resolveSchaltzeitDeleteSlot(target.row, table);
        if (!slot || slot < 1 || isProtectedSchaltzeitSlot(slot)) {
            return;
        }
        if (countOtherRowsWithSchaltzeitSlot(table, slot, target.row) > 0) {
            return;
        }
        if (table._bwSchaltzeitDeleteInFlight === slot) {
            return;
        }
        var rowCountAfter = Math.max(1, getVentilDataRows(table).length - 1);
        cancelPendingSchaltzeitDpEnsure(table);
        markSchaltzeitSlotDeleted(table, slot);
        table._bwSchaltzeitDeleteInFlight = slot;
        notifyAdapterAfterTimeRowDelete(rowCountAfter, function (cfgErr) {
            if (cfgErr) {
                try {
                    console.warn('afterTimeRowDelete:', cfgErr);
                } catch (eCfg) {}
            }
            deleteSchaltzeitStatesForNr(slot, function (delErr) {
                table._bwSchaltzeitDeleteInFlight = null;
                window.setTimeout(function () {
                    clearSkipEnsureIfSchaltzeitBackInTable(table);
                }, 1500);
                if (delErr) {
                    try {
                        console.warn('deleteSchaltzeit:', delErr);
                    } catch (eLog) {}
                    try {
                        (getTopWin(parentDoc()) || window).alert(
                            'Schaltzeit-DPs konnten nicht gelöscht werden:\n' + (delErr.message || delErr)
                        );
                    } catch (eAlert) {}
                }
            });
        });
    }

    function wireSchaltzeitDeleteDpCleanup(table) {
        if (!table || !isTab2VentilTable(table) || table._bwSchaltzeitDelDpBound) {
            return;
        }
        table._bwSchaltzeitDelDpBound = true;
        /* Tab-2 wie Tab-1 (Ventil): Zeile N löschen → SchaltzeitN-DPs entfernen */
        table.addEventListener('click', function (e) {
            var target = findSchaltzeitDeleteTarget(e.target, table);
            if (!target) {
                return;
            }
            queueSchaltzeitDpDelete(table, target);
        }, false);
    }

    function collectVentilDeleteFullIds(socket, nr) {
        var n = parseInt(nr, 10);
        if (!Number.isFinite(n) || n < 1) {
            return Promise.reject(new Error('Ungültige Ventil-Nr'));
        }
        var top = BW_ADAPTER_NS + '.Ventil' + n;
        var rangeEnd = top + '.\uffff';
        var fixed = [
            BW_ADAPTER_NS + '.SchleifenSteuerung.Ventil' + n,
            top
        ];
        var scans = [];
        if (typeof socket.getObjectViewSystem === 'function') {
            scans.push(socket.getObjectViewSystem('state', top, rangeEnd));
            scans.push(socket.getObjectViewSystem('channel', top, rangeEnd));
        }
        if (!scans.length) {
            return Promise.resolve(fixed);
        }
        return Promise.all(scans).then(function (results) {
            var ids = fixed.slice();
            var ri;
            for (ri = 0; ri < results.length; ri += 1) {
                extractObjectViewIds(results[ri]).forEach(function (id) {
                    ids.push(id);
                });
            }
            var seen = {};
            var unique = [];
            ids.forEach(function (id) {
                if (!id || seen[id]) {
                    return;
                }
                seen[id] = true;
                unique.push(id);
            });
            unique.sort(function (a, b) {
                return b.split('.').length - a.split('.').length;
            });
            return unique;
        });
    }

    function applyTimeEventsToTable(table, timeEvents, done) {
        if (!table || !Array.isArray(timeEvents) || !timeEvents.length) {
            if (done) {
                done();
            }
            return;
        }
        function writeAll() {
            var rows = getVentilDataRows(table);
            var i;
            for (i = 0; i < timeEvents.length && i < rows.length; i += 1) {
                writeRowDataToDom(rows[i], table, timeEventRowToDomData(timeEvents[i], i));
            }
            paintVentilNr(table);
            reorderActions(table);
            if (isTab2VentilTable(table)) {
                applyTab2WochentagCells(table, parentDoc());
                applyTab2AstroEinCells(table, parentDoc());
                applyTab2AstroCells(table, parentDoc());
                applyTab2ZeitInputHints(table);
            }
            if (done) {
                done(rows.length >= timeEvents.length);
            }
        }
        var rowsNow = getVentilDataRows(table);
        if (rowsNow.length >= timeEvents.length) {
            writeAll();
            return;
        }
        var before = rowsNow.length;
        if (!triggerNativeAdd(table)) {
            writeAll();
            return;
        }
        waitForNewDataRow(table, before, function () {
            if (getVentilDataRows(table).length < timeEvents.length) {
                applyTimeEventsToTable(table, timeEvents, done);
                return;
            }
            writeAll();
        }, function () {
            writeAll();
        });
    }

    function listAdapterInstancesViaAdmin(socket, done) {
        var params = { startkey: 'system.adapter.', endkey: 'system.adapter.\u9999' };
        function take(res) {
            var rows = (res && res.rows) || [];
            var ids = [];
            var i;
            for (i = 0; i < rows.length; i += 1) {
                var id = String((rows[i] && rows[i].id) || '');
                var match = id.match(/^system\.adapter\.([A-Za-z0-9_-]+)\.(\d+)$/);
                if (match) {
                    ids.push(match[1] + '.' + match[2]);
                }
            }
            done(ids);
        }
        if (!socket) {
            done([]);
            return;
        }
        if (typeof socket.getObjectView === 'function') {
            try {
                var pending = socket.getObjectView('system', 'instance', params);
                if (pending && typeof pending.then === 'function') {
                    pending.then(function (res) {
                        take(res);
                    }).catch(function () {
                        done([]);
                    });
                    return;
                }
            } catch (e) {}
        }
        if (typeof socket.emit === 'function') {
            socket.emit('getObjectView', 'system', 'instance', params, function (err, res) {
                take(err ? null : res);
            });
            return;
        }
        done([]);
    }

            var name = known[i].split('.')[0];
            if (adapterNames.indexOf(name) >= 0 && options.indexOf(known[i]) < 0) {

        select.setAttribute('data-bw-options', signature);
        select.innerHTML = '';

            var opt = doc.createElement('option');
            opt.value = options[i];

            select.appendChild(opt);
        }
        select.value = current && options.indexOf(current) >= 0 ? current : options[0];

    function loadAdapterNative(socket, done) {
        var id = 'system.adapter.' + BW_ADAPTER_NS;
        if (!socket) {
            done('Keine Admin-Verbindung', null);
            return;
        }
        if (typeof socket.getObject === 'function') {
            try {
                var pending = socket.getObject(id);
                if (pending && typeof pending.then === 'function') {
                    pending.then(function (obj) {
                        done(null, (obj && obj.native) || {});
                    }).catch(function (err) {
                        done(adminErrMsg(err) || 'getObject fehlgeschlagen', null);
                    });
                    return;
                }
            } catch (e) {
                done(adminErrMsg(e) || 'getObject fehlgeschlagen', null);
                return;
            }
        }
        if (typeof socket.emit === 'function') {
            socket.emit('getObject', id, function (err, obj) {
                done(err ? adminErrMsg(err) : null, (obj && obj.native) || {});
            });
            return;
        }
        done('getObject nicht verfügbar', null);
    }

        col.appendChild(head);
        var table = doc.createElement('table');
        table.setAttribute('data-bw-wartung-table', '1');
        table.innerHTML = '<thead><tr><th>Nr</th><th>Aus/Ein</th><th>Name</th><th>Objekt-ID (Ausgang)</th></tr></thead>';
        var body = doc.createElement('tbody');
        var i;
        if (!rows.length) {
            var empty = doc.createElement('tr');
            empty.innerHTML = '<td colspan="4">Keine Einträge</td>';
            body.appendChild(empty);
        }
        for (i = 0; i < rows.length; i += 1) {
            var item = rows[i];
            var tr = doc.createElement('tr');
            var nr = doc.createElement('td');
            nr.textContent = item.nr;
            var sw = doc.createElement('td');
            var btn = doc.createElement('button');
            btn.type = 'button';
            btn.setAttribute('data-bw-wartung-toggle', '1');
            btn.setAttribute('data-bw-active-toggle', '1');
            btn.setAttribute('data-bw-oid', item.oid);
            btn.setAttribute('role', 'switch');
            ensureActiveKnob(btn);
            styleActiveToggle(btn);
            wireActionPressAnimation(btn);
            paintWartungSwitch(btn, false);
            if (!item.oid) {
                btn.disabled = true;
                btn.style.setProperty('opacity', '0.35', 'important');
                btn.style.setProperty('cursor', 'default', 'important');
            } else {
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    var self = e.currentTarget;
                    var oid = self.getAttribute('data-bw-oid');
                    var next = self.getAttribute('data-bw-active') !== '1';
                    paintWartungSwitch(self, next);
                    getAdminSocketAsync(parentDoc(), function (err, socket) {
                        if (err || !socket) {
                            paintWartungSwitch(self, !next);
                            return;
                        }
                        setStateViaAdmin(socket, BW_ADAPTER_NS + '.Wartung.Direkt', oid + '\t' + (next ? '1' : '0'), function () {});
                    });
                }, true);
            }
            sw.appendChild(btn);
            var state = doc.createElement('span');
            state.setAttribute('data-bw-wartung-state', '1');
            state.textContent = 'Aus';
            sw.appendChild(state);
            var name = doc.createElement('td');
            name.textContent = item.name;
            var oidCell = doc.createElement('td');
            oidCell.textContent = item.oid || 'kein Ausgang';
            tr.appendChild(nr);
            tr.appendChild(sw);
            tr.appendChild(name);
            tr.appendChild(oidCell);
            body.appendChild(tr);
        }
        table.appendChild(body);
        col.appendChild(table);
        return col;
    }

    function refreshWartungSwitches(host) {
        var buttons = [].slice.call(host.querySelectorAll('[data-bw-wartung-toggle="1"]'));
        var now = Date.now();
        if (host._bwWartungAt && now - host._bwWartungAt < 2000) {
            return;
        }
        host._bwWartungAt = now;
        getAdminSocketAsync(parentDoc(), function (err, socket) {
            if (err || !socket) {
                return;
            }
            buttons.forEach(function (btn) {
                var oid = btn.getAttribute('data-bw-oid');
                if (!oid) {
                    return;
                }
                getStateViaAdmin(socket, oid, function (getErr, state) {
                    if (getErr || !state) {
                        return;
                    }
                    var on = state.val === true || state.val === 1 || state.val === '1' || state.val === 'true' || state.val === 'on';
                    paintWartungSwitch(btn, on);
                });
            });
        });
    }

    function applyWartungPanel(doc) {
        var hint = findWartungHint(doc);
        if (!hint) {
            var old = doc.querySelector('div[data-bw-wartung="1"]');
            if (old && old.parentElement) {
                old.parentElement.removeChild(old);
            }
            return;
        }
        var host = doc.querySelector('div[data-bw-wartung="1"]');
        if (host && host.querySelector('[data-bw-wartung-state="1"]')) {
            placeWartungHost(hint, host);
            refreshWartungSwitches(host);
            return;
        }
        if (host && host.parentElement) {
            host.parentElement.removeChild(host);
        }
        host = doc.createElement('div');
        host.setAttribute('data-bw-wartung', '1');
        host.setAttribute('data-bw-wartung-tables', '1');
        host.textContent = 'Ausgänge werden gelesen …';
        placeWartungHost(hint, host);
        getAdminSocketAsync(doc, function (err, socket) {
            if (err || !socket) {
                host.textContent = 'Keine Verbindung zum Adapter.';
                return;
            }
            loadAdapterNative(socket, function (loadErr, native) {
                host.textContent = '';
                if (loadErr || !native) {
                    host.textContent = 'Ausgänge konnten nicht gelesen werden.';
                    return;
                }
                host.appendChild(buildWartungColumn(doc, 'Ventile', wartungRowsFromNative(native.events)));
                host.appendChild(buildWartungColumn(doc, 'Pumpen', wartungRowsFromNative(native.pumpEvents)));
                refreshWartungSwitches(host);
            });
        });
    }

    function run() {
        if (busy) {
            return;
        }
        busy = true;
        try {
            var doc = parentDoc();
            if (!doc) {
                return;
            }
            ensureStyleLink(doc);
            injectCss(doc);
            colorTab1SchwelleHint(doc);
            ensureTooltipDelegation(doc);
            ensureTab2ZeitClockGlobalClick(doc);
            ensureTab2AstroSummaryResize(doc);
            registerObjectIdPicker(doc);
            registerVentilConfigApi(doc);
            var topWin = getTopWin(doc);
            if (topWin) {
                topWin.bwSetReactInputValue = setReactInputValue;
            }
            hideMuiTooltipPoppers(doc);
            disableAllAddButtons(doc);
            hideBottomAddRows(doc);
            applyAdapterPanelLayout(doc);
            applyTab2ZeitsteuerungSwitch(doc);
            applyPumpModeSwitch(doc);
            applyNachrichtenPanel(doc);
            applyWartungPanel(doc);
            applyVentilModeSwitch(doc);
            var root = getAdapterRoot(doc);
            if (root) {
                ensureObserver(doc, root);
            }
            var tables = findAllAdminTables(doc);
            var tab2Reentry = detectTab2AdapterConfigReentry(doc);
            if (tab2Reentry) {
                handleTab2AdapterConfigReentry(doc, tables);
            }
            var ti;
            for (ti = 0; ti < tables.length; ti += 1) {
                var table = tables[ti];
                tagAdminTable(table);
                hideTopLeftAddButton(table);
                hideHeaderTrash(table);
                applyTableBody3D(doc, table);
                if (table.getAttribute('data-bw-services-table') === '1') {
                    applyServicesTableRows(table);
                }
                if (table.getAttribute('data-bw-pump-table') === '1') {
                    ensureFocusRowTracking(table);
                    wireProtectFirstRowDelete(table);
                    wireNrColumnProtect(table);
                    var pumpRows = reorderActions(table);
                    placeAddInLastRow(table, pumpRows);
                    paintVentilNr(table);
                    applyPumpRows(table);
                    continue;
                }
                if (isVentilLikeTable(table)) {
                    var tab1Ventil = isTab1VentilTable(table);
                    if (tab1Ventil) {
                        wireVentilEditClick(table);
                    }
                    ensureFocusRowTracking(table);
                    wireCloneToFocusedRow(table);
                    wireVentilRowClone(table);
                    wireProtectFirstRowDelete(table);
                    if (tab1Ventil) {
                        wireVentilDeleteDpCleanup(table);
                        wireTab1FormSave(table);
                    }
                    wireCloseInlineOnDelete(table);
                    if (tab1Ventil) {
                        ensureNameInputValidation(table);
                    }
                    wireNrColumnProtect(table);
                    if (tab1Ventil) {
                        wireObjectIdDuplicateWatch(table);
                    }
                    var rows = reorderActions(table);
                    placeAddInLastRow(table, rows);
                    paintVentilNr(table);
                    ensureHardFirstRow(table);
                    if (tab1Ventil) {
                        scheduleSyncVentilTableFromDp(table, doc);
                        scheduleEnsureTableVentilDps(table);
                        refreshObjectIdDuplicateState(table, doc);
                        refreshTab1AusgangSwitches(table, doc);
                        refreshTab1Wartung(table, doc);
                        refreshTab1Parallel(table, doc);
                    } else if (isTab2VentilTable(table)) {
                        wireSchaltzeitDeleteDpCleanup(table);
                        wireTab2RowMovePreserve(table);
                        ensureTab2ZeitInputHints(table);
                        wireTab2SaveHook(doc);
                        if (!tab2Reentry) {
                            scheduleSyncTimeTableFromDp(table, doc);
                            scheduleEnsureTableSchaltzeitDps(table);
                            reapplyTab2ZeitDrafts(table);
                        }
                    }
                    if (tab1Ventil) {
                        cleanupOrphanInlinePanels(table);
                        dedupeSprinkleNames(table);
                        refreshTab1SchwelleFarben(table, doc);
                    }
                    reapplyClonedNameHighlights(table);
                    applyVentilTableTooltips(table, doc);
                }
            }
        } finally {
            busy = false;
        }
    }

    function getTopWinSafe() {
        try {
            return window.top;
        } catch (eTop) {
            return null;
        }
    }

    function ensureLayoutPoll() {
        var topWin = getTopWinSafe();
        run();
        if (!topWin) {
            return;
        }
        if (topWin.__bwTabLayoutPollId) {
            var owner = topWin.__bwTabLayoutPollOwner;
            var ownerDead = false;
            try {
                ownerDead = !owner || owner.closed || !owner.document;
            } catch (eOwner) {
                ownerDead = true;
            }
            if (!ownerDead) {
                return;
            }
            try {
                topWin.clearInterval(topWin.__bwTabLayoutPollId);
            } catch (eClear) {}
            topWin.__bwTabLayoutPollId = null;
            topWin.__bwTabLayoutPollOwner = null;
        }
        var n = 0;
        topWin.__bwTabLayoutPollOwner = window;
        topWin.__bwTabLayoutPollId = window.setInterval(function () {
            run();
            n += 1;
            if (n >= 600) {
                window.clearInterval(topWin.__bwTabLayoutPollId);
                topWin.__bwTabLayoutPollId = null;
                topWin.__bwTabLayoutPollOwner = null;
            }
        }, 200);
        window.addEventListener('pagehide', function () {
            if (topWin.__bwTabLayoutPollOwner !== window) {
                return;
            }
            window.clearInterval(topWin.__bwTabLayoutPollId);
            topWin.__bwTabLayoutPollId = null;
            topWin.__bwTabLayoutPollOwner = null;
        });
    }

    ensureLayoutPoll();
})();
</script>
