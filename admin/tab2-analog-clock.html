<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schaltzeit</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #fff;
        font-family: Roboto, Helvetica, Arial, sans-serif;
        color: #212121;
    }
    #root {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        min-height: 400px;
        display: flex;
        flex-direction: column;
    }
    .bw-head {
        flex: 0 0 auto;
        padding: 16px 20px 8px;
        text-align: center;
    }
    .bw-head-label {
        font-size: 11px;
        letter-spacing: 0.08em;
        color: #757575;
        text-transform: uppercase;
        margin-bottom: 6px;
    }
    .bw-head-time {
        font-size: 40px;
        font-weight: 300;
        line-height: 1;
        color: #1976d2;
        font-variant-numeric: tabular-nums;
    }
    .bw-head-time .bw-sep,
    .bw-head-time .bw-min {
        color: #212121;
    }
    .bw-picker {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 4px 16px 8px;
        min-height: 0;
    }
    .bw-col {
        position: relative;
        width: 88px;
        height: 200px;
        overflow: hidden;
        border-radius: 8px;
        background: #fafafa;
        border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .bw-col::before,
    .bw-col::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 88px;
        pointer-events: none;
        z-index: 2;
    }
    .bw-col::before {
        top: 0;
        background: linear-gradient(to bottom, #fafafa 20%, rgba(250, 250, 250, 0));
    }
    .bw-col::after {
        bottom: 0;
        background: linear-gradient(to top, #fafafa 20%, rgba(250, 250, 250, 0));
    }
    .bw-col-label {
        position: absolute;
        top: 8px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #9e9e9e;
        z-index: 3;
        pointer-events: none;
    }
    .bw-col-highlight {
        position: absolute;
        top: 50%;
        left: 8px;
        right: 8px;
        height: 44px;
        margin-top: -22px;
        border-radius: 8px;
        background: rgba(25, 118, 210, 0.12);
        border: 1px solid rgba(25, 118, 210, 0.18);
        pointer-events: none;
        z-index: 1;
    }
    .bw-list {
        height: 100%;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding: 88px 0;
        box-sizing: border-box;
    }
    .bw-list::-webkit-scrollbar {
        display: none;
    }
    .bw-item {
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        scroll-snap-align: center;
        font-size: 22px;
        font-weight: 400;
        color: #616161;
        cursor: pointer;
        font-variant-numeric: tabular-nums;
    }
    .bw-item.is-selected {
        color: #1976d2;
        font-weight: 500;
    }
    .bw-actions {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 12px 14px;
        gap: 8px;
        border-top: 1px solid rgba(0, 0, 0, 0.08);
    }
    .bw-actions button {
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 4px;
        font-family: inherit;
    }
    .bw-actions button:hover {
        background: rgba(25, 118, 210, 0.08);
    }
    .bw-clear {
        color: #d32f2f;
        margin-right: auto;
    }
    .bw-cancel, .bw-ok {
        color: #1976d2;
    }
</style>
</head>
<body>
<div id="root">
    <div class="bw-head">
        <div class="bw-head-label">Zeit wählen</div>
        <div class="bw-head-time" id="time-display">07<span class="bw-sep">:</span><span class="bw-min">00</span></div>
    </div>
    <div class="bw-picker">
        <div class="bw-col">
            <div class="bw-col-label">Std</div>
            <div class="bw-col-highlight"></div>
            <div class="bw-list" id="hours-list" aria-label="Stunde"></div>
        </div>
        <div class="bw-col">
            <div class="bw-col-label">Min</div>
            <div class="bw-col-highlight"></div>
            <div class="bw-list" id="minutes-list" aria-label="Minute"></div>
        </div>
    </div>
    <div class="bw-actions">
        <button type="button" class="bw-clear" id="btn-clear">LÖSCHEN</button>
        <button type="button" class="bw-cancel" id="btn-cancel">ABBRECHEN</button>
        <button type="button" class="bw-ok" id="btn-ok">OK</button>
    </div>
</div>
<script>
(function () {
    var MSG = 'bw-tab2-analog-clock';
    var ITEM_H = 44;
    var PAD = 88;

    function parseInitialValue(raw) {
        var s = String(raw || '').trim();
        var m = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
        return {
            hours: m ? Math.min(23, Math.max(0, parseInt(m[1], 10) || 0)) : 7,
            minutes: m ? Math.min(59, Math.max(0, parseInt(m[2], 10) || 0)) : 0
        };
    }

    function pad2(n) {
        return (n < 10 ? '0' : '') + n;
    }

    function formatValue(state) {
        return pad2(state.hours) + ':' + pad2(state.minutes);
    }

    function post(type, value) {
        var payload = { source: MSG, type: type };
        if (value != null) {
            payload.value = value;
        }
        if (window.parent && window.parent !== window) {
            window.parent.postMessage(payload, '*');
        }
    }

    var params = new URLSearchParams(window.location.search);
    var state = parseInitialValue(params.get('value'));
    var hoursList = document.getElementById('hours-list');
    var minutesList = document.getElementById('minutes-list');
    var timeDisplayEl = document.getElementById('time-display');
    var scrollTimer = null;

    function updateDisplay() {
        timeDisplayEl.innerHTML = pad2(state.hours) + '<span class="bw-sep">:</span><span class="bw-min">' + pad2(state.minutes) + '</span>';
    }

    function buildList(listEl, max, selected, onPick) {
        listEl.textContent = '';
        var i;
        for (i = 0; i <= max; i += 1) {
            var item = document.createElement('button');
            item.type = 'button';
            item.className = 'bw-item' + (i === selected ? ' is-selected' : '');
            item.textContent = pad2(i);
            item.setAttribute('data-value', String(i));
            item.addEventListener('click', function (e) {
                e.preventDefault();
                onPick(parseInt(this.getAttribute('data-value'), 10));
                scrollToValue(listEl, parseInt(this.getAttribute('data-value'), 10), false);
            });
            listEl.appendChild(item);
        }
    }

    function scrollToValue(listEl, value, smooth) {
        var top = PAD + (value * ITEM_H) - ((listEl.clientHeight / 2) - (ITEM_H / 2));
        listEl.scrollTo({
            top: Math.max(0, top),
            behavior: smooth ? 'smooth' : 'auto'
        });
    }

    function nearestValue(listEl, max) {
        var center = listEl.scrollTop + (listEl.clientHeight / 2);
        var raw = Math.round((center - PAD - (ITEM_H / 2)) / ITEM_H);
        return Math.min(max, Math.max(0, raw));
    }

    function markSelected(listEl, value) {
        listEl.querySelectorAll('.bw-item').forEach(function (item) {
            var v = parseInt(item.getAttribute('data-value'), 10);
            item.classList.toggle('is-selected', v === value);
        });
    }

    function bindScroll(listEl, key, max) {
        function syncFromScroll() {
            var value = nearestValue(listEl, max);
            state[key] = value;
            markSelected(listEl, value);
            updateDisplay();
        }
        listEl.addEventListener('scroll', function () {
            if (scrollTimer) {
                window.clearTimeout(scrollTimer);
            }
            syncFromScroll();
            scrollTimer = window.setTimeout(function () {
                scrollToValue(listEl, state[key], true);
            }, 120);
        }, { passive: true });
    }

    buildList(hoursList, 23, state.hours, function (value) {
        state.hours = value;
        updateDisplay();
        markSelected(hoursList, value);
    });
    buildList(minutesList, 59, state.minutes, function (value) {
        state.minutes = value;
        updateDisplay();
        markSelected(minutesList, value);
    });
    bindScroll(hoursList, 'hours', 23);
    bindScroll(minutesList, 'minutes', 59);
    updateDisplay();
    window.requestAnimationFrame(function () {
        scrollToValue(hoursList, state.hours, false);
        scrollToValue(minutesList, state.minutes, false);
    });

    document.getElementById('btn-clear').addEventListener('click', function () {
        post('ok', '');
    });
    document.getElementById('btn-cancel').addEventListener('click', function () {
        post('cancel');
    });
    document.getElementById('btn-ok').addEventListener('click', function () {
        post('ok', formatValue(state));
    });
})();
</script>
</body>
</html>
