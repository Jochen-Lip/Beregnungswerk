<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astro-Einstellung</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: #fff;
        color: #212121;
        font-family: Roboto, Helvetica, Arial, sans-serif;
    }
    #root {
        box-sizing: border-box;
        min-height: 500px;
        display: flex;
        flex-direction: column;
    }
    .bw-head {
        background: #1b4332;
        color: #fff;
        padding: 14px 18px;
        font-size: 16px;
        font-weight: 600;
    }
    .bw-body {
        padding: 14px 18px 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 4px;
    }
    select, input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
    }
    .bw-hint {
        font-size: 12px;
        line-height: 1.4;
        color: #555;
    }
    .bw-koord {
        padding: 8px 10px;
        border-radius: 4px;
        background: #f3f7f4;
        border: 1px solid #c8e6c9;
        font-size: 13px;
        line-height: 1.4;
    }
    .bw-koord.is-missing {
        background: #fff8e1;
        border-color: #f9a825;
    }
    .bw-preview {
        font-size: 20px;
        font-weight: 700;
        color: #2e7d32;
        font-variant-numeric: tabular-nums;
    }
    .bw-actions {
        margin-top: auto;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 18px 14px;
        border-top: 1px solid #e0e0e0;
    }
    button {
        padding: 8px 16px;
        border: 1px solid #cfcfcf;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }
    #btn-cancel { background: #e0e0e0; }
    #btn-ok { background: #2d6a4f; color: #fff; border-color: #2d6a4f; }
</style>
</head>
<body>
<div id="root">
    <div class="bw-head">Astro-Einstellung</div>
    <div class="bw-body">
        <div>
            <label for="bw-typ">Ereignis</label>
            <select id="bw-typ"></select>
        </div>
        <div>
            <label for="bw-offset">Versatz in Minuten</label>
            <input id="bw-offset" type="number" min="-180" max="180" step="1" value="0">
            <div class="bw-hint">0 ist der Zeitpunkt selbst. Plus liegt danach, minus davor.</div>
        </div>
        <div id="bw-koord" class="bw-koord">Koordinaten werden gelesen …</div>
        <div>
            <div class="bw-hint">Nächste Schaltzeit</div>
            <div class="bw-preview" id="bw-preview">—</div>
        </div>
    </div>
    <div class="bw-actions">
        <button type="button" id="btn-cancel">Abbrechen</button>
        <button type="button" id="btn-ok">Übernehmen</button>
    </div>
</div>
<script>
(function () {
    var MSG = 'bw-tab2-astro-settings';
    var TYPES = [
        { id: 'sunrise', label: 'Sonnenaufgang' },
        { id: 'sunriseEnd', label: 'Sonnenaufgang Ende' },
        { id: 'sunset', label: 'Sonnenuntergang' },
        { id: 'sunsetStart', label: 'Sonnenuntergang Beginn' },
        { id: 'dawn', label: 'Morgendämmerung' },
        { id: 'dusk', label: 'Abenddämmerung' },
        { id: 'goldenHour', label: 'Goldene Stunde (Abend)' },
        { id: 'goldenHourEnd', label: 'Goldene Stunde (Morgen)' },
        { id: 'solarNoon', label: 'Sonnenhöchststand' },
        { id: 'night', label: 'Nachtbeginn' },
        { id: 'nightEnd', label: 'Nachtende' }
    ];
    var koord = null;
    var typEl = document.getElementById('bw-typ');
    var offsetEl = document.getElementById('bw-offset');
    var koordEl = document.getElementById('bw-koord');
    var previewEl = document.getElementById('bw-preview');

    TYPES.forEach(function (item) {
        var opt = document.createElement('option');
        opt.value = item.id;
        opt.textContent = item.label;
        typEl.appendChild(opt);
    });

    function post(type, payload) {
        var msg = { source: MSG, type: type };
        if (payload) {
            msg.payload = payload;
        }
        if (window.parent && window.parent !== window) {
            window.parent.postMessage(msg, '*');
        }
    }

    function parseNum(raw) {
        if (raw === null || raw === undefined || raw === '') {
            return NaN;
        }
        return parseFloat(String(raw).replace(',', '.'));
    }

    function pad(n) {
        return (n < 10 ? '0' : '') + n;
    }

    function clampOffset(val) {
        var n = parseInt(val, 10);
        if (!isFinite(n)) {
            return 0;
        }
        if (n < -180) {
            return -180;
        }
        if (n > 180) {
            return 180;
        }
        return n;
    }

    var PI = Math.PI;
    var rad = PI / 180;
    var dayMs = 86400000;
    var J1970 = 2440588;
    var J2000 = 2451545;
    var J0 = 0.0009;
    var e = rad * 23.4397;
    var angles = [
        [-0.833, 'sunrise', 'sunset'],
        [-0.833, 'sunriseEnd', 'sunsetStart'],
        [-6, 'dawn', 'dusk'],
        [-18, 'nightEnd', 'night'],
        [6, 'goldenHourEnd', 'goldenHour']
    ];

    function toDays(date) {
        return date.valueOf() / dayMs - 0.5 + J1970 - J2000;
    }
    function declination(l) {
        return Math.asin(Math.sin(0) * Math.cos(e) + Math.cos(0) * Math.sin(e) * Math.sin(l));
    }
    function solarMeanAnomaly(d) {
        return rad * (357.5291 + 0.98560028 * d);
    }
    function eclipticLongitude(M) {
        var C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
        return M + C + rad * 102.9372 + PI;
    }
    function solarTransitJ(ds, M, L) {
        return J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
    }
    function hourAngle(h, phi, d) {
        var x = (Math.sin(h) - Math.sin(phi) * Math.sin(d)) / (Math.cos(phi) * Math.cos(d));
        if (x < -1 || x > 1) {
            return NaN;
        }
        return Math.acos(x);
    }
    function fromJulian(j) {
        return new Date((j + 0.5 - J1970) * dayMs);
    }
    function getTimes(date, lat, lng) {
        var lw = rad * -lng;
        var phi = rad * lat;
        var d = toDays(date);
        var n = Math.round(d - J0 - lw / (2 * PI));
        var ds = J0 + lw / (2 * PI) + n;
        var M = solarMeanAnomaly(ds);
        var L = eclipticLongitude(M);
        var dec = declination(L);
        var Jnoon = solarTransitJ(ds, M, L);
        var result = { solarNoon: fromJulian(Jnoon) };
        angles.forEach(function (row) {
            var w = hourAngle(row[0] * rad, phi, dec);
            if (isNaN(w)) {
                return;
            }
            var a = J0 + (w + lw) / (2 * PI) + n;
            var Jset = solarTransitJ(a, M, L);
            var Jrise = Jnoon - (Jset - Jnoon);
            result[row[1]] = fromJulian(Jrise);
            result[row[2]] = fromJulian(Jset);
        });
        return result;
    }

    function paintCoords() {
        if (!koord) {
            koordEl.className = 'bw-koord is-missing';
            koordEl.textContent = 'Keine Koordinaten. Unter Systemeinstellungen Breiten- und Längengrad eintragen. Der JavaScript-Adapter ist nur nötig, wenn dort nichts steht.';
            previewEl.textContent = '—';
            return;
        }
        koordEl.className = 'bw-koord';
        koordEl.textContent = koord.lat.toFixed(4) + '° N, ' + koord.lon.toFixed(4) + '° O · ' + koord.quelle;
        var offset = clampOffset(offsetEl.value);
        var when = nextSchaltzeit(typEl.value, offset);
        if (!when) {
            previewEl.textContent = 'nicht berechenbar';
            return;
        }
        previewEl.textContent = formatNaechste(when);
    }

    function nextSchaltzeit(typ, offsetMin) {
        var now = new Date();
        var i;
        for (i = 0; i < 4; i += 1) {
            var day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, 12, 0, 0, 0);
            var times = getTimes(day, koord.lat, koord.lon);
            var basis = times[typ];
            if (!basis || isNaN(basis.getTime())) {
                continue;
            }
            var start = new Date(basis.getTime() + offsetMin * 60000);
            if (start.getTime() > now.getTime()) {
                return start;
            }
        }
        return null;
    }

    function formatNaechste(when) {
        return pad(when.getHours()) + ':' + pad(when.getMinutes());
    }

    function usePair(lat, lon, quelle) {
        if (!isNaN(lat) && !isNaN(lon)) {
            koord = { lat: lat, lon: lon, quelle: quelle };
            return true;
        }
        return false;
    }

    function readToken() {
        var stores = [];
        try {
            if (window.parent && window.parent.localStorage) {
                stores.push(window.parent.localStorage);
            }
            if (window.parent && window.parent.sessionStorage) {
                stores.push(window.parent.sessionStorage);
            }
        } catch (e) {}
        stores.push(localStorage, sessionStorage);
        var i;
        for (i = 0; i < stores.length; i += 1) {
            try {
                var raw = stores[i].getItem('iob_tokens');
                if (!raw) {
                    continue;
                }
                var parts = raw.split(';');
                if (parts[2]) {
                    return parts[2];
                }
            } catch (e2) {}
        }
        return '';
    }

    function connect(done) {
        var ioLib = null;
        try {
            ioLib = (window.parent && window.parent.io) || window.io;
        } catch (e) {}
        if (!ioLib || typeof ioLib.connect !== 'function') {
            done(null);
            return;
        }
        var token = readToken();
        var socketPath = '/socket.io';
        try {
            if (window.parent && window.parent.socketPath) {
                socketPath = window.parent.socketPath;
            }
        } catch (ePath) {}
        var sock = ioLib.connect(window.location.origin, {
            path: socketPath,
            transports: ['polling', 'websocket'],
            reconnection: false,
            timeout: 8000,
            query: { ws: 'true', token: token }
        });
        var timer = window.setTimeout(function () {
            done(null);
        }, 8000);
        sock.on('connect', function () {
            sock.emit('authenticate', function (ok) {
                window.clearTimeout(timer);
                done(ok ? sock : null);
            });
        });
        sock.on('connect_error', function () {
            window.clearTimeout(timer);
            done(null);
        });
    }

    function loadCoords() {
        connect(function (sock) {
            if (!sock) {
                koordEl.className = 'bw-koord is-missing';
                koordEl.textContent = 'Keine Verbindung zum Admin. Koordinaten stehen unter Systemeinstellungen.';
                return;
            }
            function asObject(err, obj) {
                if (err && err._id && obj === undefined) {
                    return err;
                }
                return obj || null;
            }
            sock.emit('getObject', 'system.adapter.javascript.0', function (errJs, jsRaw) {
                var jsObj = asObject(errJs, jsRaw);
                var js = jsObj && jsObj.native ? jsObj.native : null;
                sock.emit('getObject', 'system.config', function (errSys, sysRaw) {
                    var sysObj = asObject(errSys, sysRaw);
                    var sys = sysObj && sysObj.common ? sysObj.common : null;
                    var used = false;
                    if (js) {
                        used = usePair(parseNum(js.latitude), parseNum(js.longitude), 'JavaScript-Adapter');
                    }
                    if (!used && sys) {
                        used = usePair(parseNum(sys.latitude), parseNum(sys.longitude), 'Systemeinstellungen');
                    }
                    if (!used && jsObj && sys) {
                        var lat = parseNum(sys.latitude);
                        var lon = parseNum(sys.longitude);
                        if (!isNaN(lat) && !isNaN(lon)) {
                            jsObj.native = jsObj.native || {};
                            jsObj.native.latitude = lat;
                            jsObj.native.longitude = lon;
                            sock.emit('setObject', 'system.adapter.javascript.0', jsObj, function () {});
                            usePair(lat, lon, 'Systemeinstellungen, im JavaScript-Adapter übernommen');
                        }
                    }
                    paintCoords();
                });
            });
        });
    }

    var params = new URLSearchParams(window.location.search);
    var typ = params.get('typ') || 'sunrise';
    if (!TYPES.some(function (item) { return item.id === typ; })) {
        typ = 'sunrise';
    }
    typEl.value = typ;
    offsetEl.value = String(clampOffset(params.get('offset')));
    typEl.addEventListener('change', paintCoords);
    offsetEl.addEventListener('input', paintCoords);
    document.getElementById('btn-cancel').addEventListener('click', function () {
        post('cancel');
    });
    document.getElementById('btn-ok').addEventListener('click', function () {
        post('ok', { typ: typEl.value, offset: clampOffset(offsetEl.value) });
    });
    paintCoords();
    loadCoords();
})();
</script>
</body>
</html>
