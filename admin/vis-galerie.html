<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Visualisierung</title>
    <style>
        body {
            margin: 0;
            background: #f4f7f4;
            color: #1b4332;
            font: 14px/1.3 system-ui, sans-serif;
        }
        h2 {
            margin: 0 0 8px;
            font-size: 15px;
        }
        .ueber {
            display: block;
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            object-position: left center;
            background: #111;
            border-radius: 8px;
            cursor: pointer;
        }
        .raster {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
        }
        button.kachel {
            width: 108px;
            padding: 8px;
            border: 1px solid #c9e4d4;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            text-align: center;
        }
        button.kachel img {
            width: 72px;
            height: 72px;
            object-fit: contain;
            background: #111;
            border-radius: 6px;
        }
        button.kachel.hell img {
            background: #f7f7f7;
        }
        button.kachel span {
            display: block;
            margin-top: 6px;
            font-size: 12px;
        }
        dialog {
            border: none;
            padding: 12px;
            background: #111;
            border-radius: 10px;
            max-width: 92vw;
        }
        dialog img {
            max-width: 86vw;
            max-height: 78vh;
            display: block;
        }
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.55);
        }
    </style>
</head>
<body>
    <h2>Erste Visualisierung</h2>
    <img class="ueber" src="./vis-bilder/erste-ansicht.png" alt="Erste Ansicht" data-gross="1">
    <div class="raster" id="raster"></div>
    <dialog id="gross">
        <img alt="">
    </dialog>
    <script>
        var bilder = [
            ['sprinkler-weiss.gif', 'Sprinkler'],
            ['sprinkler-aus.png', 'Sprinkler aus'],
            ['pumpe.png', 'Pumpe'],
            ['pumpe-aus.png', 'Pumpe aus'],
            ['brunnenpumpe.png', 'Brunnenpumpe'],
            ['schalter-ein.png', 'Ein'],
            ['schalter-aus.png', 'Aus'],
            ['kreuz.png', 'Gesperrt'],
            ['regen.png', 'Regen', 'hell'],
            ['sonnenaufgang.png', 'Sonnenaufgang', 'hell'],
            ['sonnenuntergang.png', 'Sonnenuntergang', 'hell'],
            ['temperatur.png', 'Temperatur', 'hell'],
            ['feuchtigkeit.png', 'Feuchtigkeit', 'hell'],
            ['kies.png', 'Tankfüllung']
        ];
        var raster = document.getElementById('raster');
        var dialog = document.getElementById('gross');
        var dialogBild = dialog.querySelector('img');
        var offenSeit = 0;
        function zeige(src, name) {
            dialogBild.src = src;
            dialogBild.alt = name;
            offenSeit = Date.now();
            dialog.showModal();
        }
        bilder.forEach(function (eintrag) {
            var knopf = document.createElement('button');
            knopf.type = 'button';
            knopf.className = 'kachel' + (eintrag[2] ? ' ' + eintrag[2] : '');
            var bild = document.createElement('img');
            bild.src = './vis-bilder/' + eintrag[0];
            bild.alt = eintrag[1];
            var text = document.createElement('span');
            text.textContent = eintrag[1];
            knopf.appendChild(bild);
            knopf.appendChild(text);
            knopf.addEventListener('click', function () {
                zeige(bild.src, eintrag[1]);
            });
            raster.appendChild(knopf);
        });
        document.querySelector('.ueber').addEventListener('click', function (e) {
            zeige(e.currentTarget.src, 'Erste Ansicht');
        });
        dialog.addEventListener('click', function () {
            if (Date.now() - offenSeit < 300) return;
            dialog.close();
        });
    </script>
</body>
</html>
